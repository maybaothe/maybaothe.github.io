name: Deploy MayBaoThe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (app + Firebase sign-in helper)
        run: |
          mkdir -p _site/__/auth _site/__/firebase
          cp -r index.html manifest.webmanifest sw.js icons _site/
          B=https://maybaothe.firebaseapp.com
          curl -fsSL $B/__/auth/handler        -o _site/__/auth/handler.html
          curl -fsSL $B/__/auth/handler.js     -o _site/__/auth/handler.js
          curl -fsSL $B/__/auth/experiments.js -o _site/__/auth/experiments.js
          curl -fsSL $B/__/auth/iframe         -o _site/__/auth/iframe.html
          curl -fsSL $B/__/auth/iframe.js      -o _site/__/auth/iframe.js
          curl -fsSL $B/__/firebase/init.json  -o _site/__/firebase/init.json
          touch _site/.nojekyll
          ls -R _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
