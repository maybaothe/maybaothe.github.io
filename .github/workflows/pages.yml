name: Deploy MayBaoThe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (app + Firebase sign-in helper)
        run: |
          mkdir -p _site/__/auth _site/__/firebase
          cp -r index.html manifest.webmanifest sw.js icons _site/
          B=https://maybaothe.firebaseapp.com
          get(){ code=$(curl -sSL -w '%{http_code}' -o "$2" "$B$1"); echo "$1 -> $code"; [ "$code" = 200 ] || rm -f "$2"; }
          get /__/auth/handler        _site/__/auth/handler.html
          get /__/auth/handler.js     _site/__/auth/handler.js
          get /__/auth/experiments.js _site/__/auth/experiments.js
          get /__/auth/iframe         _site/__/auth/iframe.html
          get /__/auth/iframe.js      _site/__/auth/iframe.js
          get /__/firebase/init.json  _site/__/firebase/init.json
          test -s _site/__/auth/handler.html && test -s _site/__/auth/handler.js
          touch _site/.nojekyll
          ls -R _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
