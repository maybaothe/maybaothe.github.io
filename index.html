    stop:()=>{on=false;try{r&&r.stop()}catch(e){}emit('s',{state:'idle',reason:'stopped'});return Promise.resolve()}};

<script>
'use strict';
/* ===== Tiện ích ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{const n=Number(String(v??'').replace(/[^\d-]/g,''));return isFinite(n)?n:0};
const pnum=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(+n||0));
const money=n=>fmt(n)+' ₫';
const mshort=n=>{n=+n||0;const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+' tỷ';if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',')+' tr';if(a>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n))};
const pc=n=>(Math.round((+n||0)*100)/100).toString().replace('.',',')+'%';
const sum=(a,f)=>a.reduce((s,x)=>s+(+(f?f(x):x)||0),0);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=String(s||ymd(new Date())).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const mk=(y,m,d)=>new Date(y,m,Math.min(d,dim(y,m)));
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addM=(d,n)=>mk(d.getFullYear(),d.getMonth()+n,d.getDate());
const diff=(a,b)=>Math.round((b-a)/864e5);
const TODAY=()=>pd(ymd(new Date()));
const dmy=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const dm=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const dtShow=s=>{const d=pd(s);return dm(d)+'/'+String(d.getFullYear()).slice(2)+(String(s).length>10?' '+String(s).slice(11,16):'')};
const mkey=s=>String(s).slice(0,7);
const sw=(a,w)=>a.split(w).length;
const noAccent=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
const hue=s=>{let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h};

/* ===== Chu kỳ sao kê ===== */
function nextStmt(c,ref){const S=+c.stmtDay||1;let d=mk(ref.getFullYear(),ref.getMonth(),S);if(d<ref)d=mk(ref.getFullYear(),ref.getMonth()+1,S);return d}
const rcm=c=>c.rcMonth==null?/bidv/i.test(c.bank||''):!!c.rcMonth;
const rEnd=(c,d)=>rcm(c)?mk(d.getFullYear(),d.getMonth()+1,0):nextStmt(c,d);
function prevStmt(c,st){return mk(st.getFullYear(),st.getMonth()-1,+c.stmtDay||1)}
function dueOf(c,st){const Dd=+c.dueDay||1;let d=mk(st.getFullYear(),st.getMonth(),Dd);if(d<=st)d=mk(st.getFullYear(),st.getMonth()+1,Dd);return d}

/* ===== Kho dữ liệu (db đồng bộ; dự phòng localStorage) ===== */
const COLS=['cards','txs','savings','inst','wallet','recur','inbox','merch'];
const DEF={openBalance:0,alertDays:5,spendDays:20,dismissed:{}};
let db=null,dl=null,D={cards:[],txs:[],savings:[],inst:[],wallet:[],recur:[],inbox:[],merch:[],settings:{}};
const LKEY='sotthe_v1';
const S=()=>({...DEF,...(D.settings||{})});
function lsSave(){try{localStorage.setItem(LKEY,JSON.stringify(D))}catch(e){}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'null');if(o)for(const k of [...COLS,'settings'])if(o[k])D[k]=o[k];DV++}catch(e){}}
let rq=0;function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;draw()})}
function toast(m){const t=$('#ts');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)}
function upsertLocal(col,o){DV++;if(col==='settings'){D.settings={...o};return}const a=D[col],i=a.findIndex(x=>x.id===o.id);if(i<0)a.push({...o});else a[i]={...o}}
let PUTQ=null; /* đang lấy mail: gom các lần lưu, gửi song song, vẽ lại 1 lần ở cuối */
async function put(col,o){
  o.id=o.id||(col==='settings'?'main':uid());
  upsertLocal(col,o);
  if(PUTQ){if(db){const b={...o};delete b.id;PUTQ.push(db.collection(col).doc(o.id).set(b).catch(e=>{PUTQ.err=e}))}return o}
  render();
  if(db){try{const b={...o};delete b.id;await db.collection(col).doc(o.id).set(b)}catch(e){toast('Không lưu được: '+(e.message||e.code||'lỗi'));render()}}
  else lsSave();
  return o;
}
async function del(col,id){
  DV++;D[col]=D[col].filter(x=>x.id!==id);
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast('Không xóa được: '+(e.message||e.code||'lỗi'))}}else lsSave();
  render();
}
async function initStore(){
  try{db=await claude.use('db')}catch(e){db=null}
  try{dl=await claude.use('downloads')}catch(e){dl=null}
  if(!db){lsLoad();return false}
  [...COLS,'settings'].forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const arr=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(col==='settings'){D.settings=arr.find(x=>x.id==='main')||{}}else D[col]=arr;DV++;
      D.loaded=(D.loaded||0)+1;render();
      if(col==='inbox'&&!window._hcRP){window._hcRP=1;setTimeout(()=>{try{hcReparse()}catch(_){}},2000)}
    },e=>{D.loaded=(D.loaded||0)+1;toast('Lỗi đồng bộ: '+(e.message||e.code||''));render()});
  });
  return true;
}

/* ===== Ví ===== */
function walletRows(){
  const cm=Object.fromEntries(D.cards.map(c=>[c.id,c])),r=[];
  D.txs.forEach(t=>{
    const c=cm[t.cardId],nm=c?c.bank+' '+(c.name||''):'thẻ';
    if(t.kind==='payment')r.push({date:t.ts,kind:'chi',amount:+t.amount||0,label:'Thanh toán '+nm,auto:1});
    if(t.kind==='spend'&&t.backStatus==='done'&&t.status!=='planned'){const x=(V&&V.tx[t.id])||{};r.push({date:t.backDate||t.ts,kind:'thu',amount:t.backAmount!==''&&t.backAmount!=null?+t.backAmount:(x.back||0),label:'Back GD '+nm,auto:1})}
  });
  D.wallet.forEach(w=>r.push({date:w.date,kind:w.kind,amount:+w.amount||0,label:(w.cat?w.cat+' · ':'')+(w.note||''),id:w.id}));
  return r.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

/* ===== Tính toán ===== */
let V=null;
/* Tiến độ mục tiêu của 1 thẻ trong 1 kỳ. Thẻ có "Hoàn tối đa chung" (VD Sacom Cashback 680k: 4789 hoàn 16,8% HOẶC 5411 hoàn 6,8%):
   đủ khi tổng hoàn đạt trần chung; mục tiêu = số đã cà + số còn phải cà theo MCC đang dùng. */
function capProg(c,L){
  const rules=c.rules||[];
  if(!(+c.capAll>0)){const rs=rules.filter(r=>+r.need>0),codes=new Set(rs.map(r=>String(r.code)));return{need:Math.max(0,...rs.map(r=>+r.need)),spent:sum(L.filter(t=>codes.has(String(t.mcc))),t=>t.amount)}}
  const rs=rules.filter(r=>+r.pct>0);if(!rs.length)return{need:0,spent:0};
  const by=rs.map(r=>{const a=L.filter(t=>String(t.mcc)===String(r.code));return{r,sp:sum(a,t=>t.amount)}});

/* ===== Biểu đồ SVG ===== */
const PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
let GID=0;
function donut(items,mid){
  const tot=sum(items,i=>i.v);if(tot<=0)return '<div class="empty">Chưa có số liệu</div>';
  const r=56,C=2*Math.PI*r;let acc=0,segs='';
  items.forEach((it,k)=>{const len=Math.max(0,it.v/tot*C-(items.length>1?3:0));segs+=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${PAL[k%6]}" stroke-width="17" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 75 75)" stroke-linecap="butt"><title>${esc(String(it.l).replace(/<[^>]+>/g,''))}: ${money(it.v)}</title></circle>`;acc+=it.v/tot*C});
  return `<div class="row" style="gap:22px;align-items:center"><svg viewBox="0 0 150 150" width="168" height="168" role="img" aria-label="Biểu đồ tròn"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surf2)" stroke-width="17"/>${segs}<text x="75" y="75" text-anchor="middle" style="font:800 17px var(--f-h);fill:var(--ink)">${mid}</text><text x="75" y="92" text-anchor="middle">tổng cộng</text></svg><div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px">${items.map((it,k)=>`<div class="mrow" style="padding:6px 0"><span class="row" style="flex-wrap:nowrap;gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${PAL[k%6]};flex:none"></i><span style="min-width:0;overflow-wrap:anywhere">${it.l}</span></span><span style="text-align:right;white-space:nowrap"><b>${mshort(it.v)}</b> <span class="hint">${Math.round(it.v/tot*100)}%</span></span></div>`).join('')}</div></div>`;
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function bars(labels,series){
  const W=560,H=230,pl=44,pr=8,pt=12,pb=28,n=labels.length,id='g'+(++GID),mx=niceMax(Math.max(0,...series.flatMap(s=>s.v.map(Math.abs)))),ih=H-pt-pb,gw=(W-pl-pr)/n,bw=Math.max(6,Math.min(40,gw/(series.length+0.8)-3));
  let g='<defs>'+series.map((s,k)=>`<linearGradient id="${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}"/><stop offset="1" stop-color="${s.c}" stop-opacity=".55"/></linearGradient>`).join('')+'</defs>';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" ${i?'stroke-dasharray="3 4"':''}/><text x="${pl-6}" y="${y+4}" text-anchor="end" style="font-size:10px">${i?mshort(mx*i/4):'0'}</text>`}
  labels.forEach((l,i)=>{const cx=pl+i*gw+gw/2,tw=series.length*(bw+3)-3;series.forEach((s,k)=>{const v=s.v[i]||0,h=Math.abs(v)/mx*ih,x=cx-tw/2+k*(bw+3),y=pt+ih-h;if(v)g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,2)}" rx="${Math.min(10,bw/2)}" fill="url(#${id}${k})"><title>${esc(s.n)} · ${esc(l)}: ${money(v)}</title></rect>`;if(v&&n<=7)g+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" style="font-size:10px;font-weight:600;fill:var(--ink)">${mshort(v)}</text>`});g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cột">${g}</svg><div class="leg" style="margin-top:6px">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`;
}
const prog=(v,mx,cls='')=>`<div class="bar ${cls}"><i style="width:${Math.min(100,mx>0?v/mx*100:0)}%"></i></div>`;

function progress(c,x){

    return `<div class="pg"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:6px"><b>MCC: ${esc(r.code)} <span class="mut" style="font-weight:500">(${pc(r.pct)})</span></b><span style="font-size:13px;white-space:nowrap"><b>${fmt(sp)}</b>${need?' <span class="mut">/ '+fmt(need)+' ₫</span>':' ₫'}</span></div>${need?`<div class="bar ${done?'g':sp?'w':''}" style="margin:10px 0"><i style="width:${done?100:Math.min(95,pct)}%"></i></div>`:'<div style="height:10px"></div>'}<div class="row" style="justify-content:space-between;background:var(--surf2);border-radius:10px;padding:7px 10px"><span class="hint">Lãi dự tính (sau phí):</span><b class="${lai>=0?'pos':'neg'}">${fmt(lai)} ₫</b></div>${need?`<div style="margin-top:8px">${done?(sp>need?chip('Vượt mức: '+fmt(sp-need)+' ₫','w'):chip('Đã cà đủ','g')):chip('Còn thiếu '+fmt(rest)+' ₫'+(x.dts<=S().spendDays?' · còn '+x.daysLeft+' ngày':''),x.daysLeft<=3?'b':'a')}</div>`:''}</div>`}).join('');

const ib=(a,id,ic,t,cls='')=>`<button type="button" class="ib ${cls}" data-a="${a}" data-id="${esc(id)}" title="${t}" aria-label="${t}">${ico(ic,16)}</button>`;

const PERS=[['7','7 ngày'],['30','30 ngày'],['month','Tháng này'],['prev','Tháng trước'],['all','Tất cả']];
function inPer(ts){
  const p=UI.txPer,k=mkey(ts);if(p==='all'||!p)return true;
  if(p==='month')return k===cmKey();if(p==='prev')return k===ymd(mk(V.ref.getFullYear(),V.ref.getMonth()-1,1)).slice(0,7);
  return String(ts).slice(0,10)>=ymd(addD(V.ref,-(+p-1)));
}
function txFilter(kinds){
  const q=noAccent(UI.txQ).toLowerCase(),cm=Object.fromEntries(D.cards.map(c=>[c.id,c]));
  return D.txs.filter(t=>{
    if(!kinds.includes(t.kind)||(UI.txCard&&t.cardId!==UI.txCard)||!inPer(t.ts))return false;
    const st=UI.txSt;if(st==='planned'&&t.status!=='planned')return false;if(st==='swiped'&&t.status==='planned')return false;
    if(st==='backpend'&&!(t.kind==='spend'&&t.status!=='planned'&&t.backStatus!=='done'))return false;
    if(st==='backdone'&&!(t.kind==='spend'&&t.backStatus==='done'))return false;
    if(q){const c=cm[t.cardId]||{};if(!noAccent((t.desc||'')+' '+(t.mcc||'')+' '+(t.note||'')+' '+(c.bank||'')+' '+(c.name||'')+' '+(c.owner||'')+' '+(c.last4||'')+' '+(t.cardId?'':'chua gan the')).toLowerCase().includes(q))return false}
    return true}).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
}
const cardOpts=(sel,all)=>(all?'<option value="">Tất cả thẻ</option>':'')+D.cards.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${cname(c)}${c.owner?' — '+esc(c.owner):''}</option>`).join('');
function cardPick(){

const KL2={spend:['Chi tiêu','a'],payment:['Thanh toán','g'],cashback:['Hoàn tiền','t'],points:['Tích điểm','w']};
const isEm=t=>!!t&&!!t.src;const emTr=t=>isEm(t)?'<tr class="em" title="Lấy tự động từ email/thông báo">':'<tr>';const emK=t=>isEm(t)?'<span class="emk">MAIL</span>':'';

  (()=>{const n=D.txs.filter(t=>!t.cardId&&t.kind==='spend').length;return n?`<div class="card" style="border-left:4px solid var(--warn,#f59e0b)"><b>${n} giao dịch chi tiêu chưa gán thẻ.</b> <span class="hint">File CSV xuất từ web cũ không có cột thẻ nên cần chọn thẻ ở cột “Thẻ / chủ thẻ” của từng dòng (lọc “Chưa gán” bằng ô tìm kiếm: gõ <i>chua gan</i>).</span></div>`:''})()+`<div class="tabs" role="tablist"><button class="${tab==='all'?'on':''}" data-a="txtab" data-id="all">Tất cả</button><button class="${tab==='spend'?'on':''}" data-a="txtab" data-id="spend">Chi tiêu</button><button class="${tab==='topup'?'on':''}" data-a="txtab" data-id="topup">Nạp tiền · Hoàn · Điểm</button></div>
  <div class="card"><div class="fl"><input data-f="txQ" value="${esc(UI.txQ)}" placeholder="Tìm mô tả, ngân hàng, tên thẻ, chủ thẻ…" aria-label="Tìm giao dịch" style="flex:2 1 220px">${cardPick()}<select data-f="txPer" aria-label="Khoảng thời gian">${PERS.map(o=>`<option value="${o[0]}"${o[0]===UI.txPer?' selected':''}>${o[1]}</option>`).join('')}</select>${sp?`<select data-f="txSt" aria-label="Trạng thái">${[['','Mọi trạng thái'],['swiped','Đã cà'],['planned','Dự kiến'],['backpend','Chờ back'],['backdone','Đã back']].map(o=>`<option value="${o[0]}"${o[0]===UI.txSt?' selected':''}>${o[1]}</option>`).join('')}</select>`:''}</div></div>`;
  if(sp){
    const days={};const add=(d,k,v)=>{d=String(d).slice(5,10);days[d]=days[d]||{in:0,out:0};days[d][k]+=v};
    live.forEach(t=>{if(t.backStatus==='done')add(t.backDate||t.ts,'in',T(t).back)});

/* ===== Quản lý MCC ===== */
const sigOf=r=>[r.pct,r.target,r.need,r.feePct,r.feeFix,r.cond,r.rfFee||''].map(v=>v==null?'':v).join('|');
function mccGroups(){

  return Object.keys(g).sort().map(code=>({code,sigs:Object.values(g[code])}));
}
function pgMcc(){

}

/* ===== Lợi nhuận theo kỳ hoàn tiền: gom theo kỳ, ghi vào tháng kết thúc kỳ ===== */

const kyStart=(c,end)=>rcm(c)?mk(end.getFullYear(),end.getMonth(),1):addD(prevStmt(c,end),1);

/* ===== Hướng dẫn ===== */
function pgHuongDan(){

  ['Thẻ tín dụng','Bấm “Thêm thẻ” và nhập thông tin (chỉ nhập 4 số cuối, không nhập số thẻ đầy đủ hay CVV). Mỗi thẻ có: Chi tiết, QR (mã nhận tiền), Thanh toán (QR theo số tiền kỳ sao kê), Sửa, MCC (cấu hình hoàn tiền), Clone (tạo nhanh 1 hoặc nhiều thẻ giống thẻ này — nhập số lượng rồi điền tên, 4 số cuối, chủ thẻ cho từng thẻ), Xóa.'],
  ['Giao dịch thẻ','Thêm giao dịch chi tiêu: chọn thẻ, MCC (đã cấu hình ở thẻ), số tiền; phí = số tiền × % phí + phí cố định; Back = số tiền − phí; Hoàn = số tiền × % hoàn (không vượt “mục tiêu hoàn tối đa” mỗi kỳ). Tab Nạp tiền: ghi thanh toán thẻ, hoàn tiền, tích điểm. Giao dịch “Dự kiến” chưa tính vào nợ.'],
  ['Giao dịch bằng giọng nói','Bấm nút “Giọng nói” (Tổng quan / Giao dịch thẻ), bấm micro rồi nói, VD: “thẻ JCB BIDV của Thúy Liểu giao dịch 5tr hôm nay”. App tự nhận thẻ (ngân hàng + loại thẻ + chủ thẻ, hoặc “đuôi 1234”), số tiền (5tr, 5 triệu 2, 5tr5, 500k…), ngày (hôm nay/hôm qua/ngày 15, lúc 14h30). MCC: không nói → MCC hoàn tiền mặc định (MCC đầu tiên trong cấu hình thẻ); nói “MCC 5411” để chọn khác. Phí: không nói → theo MCC; “phí 1,5%” → đổi % phí; “phí 50k” → phí cố định 50.000 ₫; “không phí” → 0. Có thể gõ thay vì nói (Windows: Win + H để đọc vào ô). Bật “Tự lưu” để nói liên tục nhiều giao dịch. Xử lý hoàn toàn trong máy, không tốn token.'],
  ['Hàng chờ giao dịch','Giao dịch được lấy tự động từ thông báo app ngân hàng (Android, qua MacroDroid) và email ngân hàng (iPhone), gom về Gmail có nhãn MayBaoThe. Bấm “Lấy giao dịch mới”: app tự đọc số tiền, điểm bán, thời gian, khớp thẻ theo 4 số cuối hoặc tên thẻ + chủ thẻ, gợi ý MCC theo điểm bán đã từng nhập. Anh kiểm tra rồi bấm “Ghi vào sổ”. Thông báo sao kê được dùng để đối chiếu dư nợ.'],
  ['Quản lý MCC','Tổng hợp mọi cấu hình MCC của các thẻ, gom theo mã và quy tắc giống nhau. Có thể tạo/sửa hàng loạt cho nhiều thẻ. Nút “Sửa hoàn tiền hàng loạt” (cũng có ở tab Thẻ tín dụng): lọc theo ngân hàng / MCC, tick các thẻ, nhập giá trị mới cho % hoàn, hoàn tối đa, cần quẹt, % phí — ô để trống giữ nguyên; “Cần quẹt” tự tính lại theo hoàn tối đa ÷ % hoàn.'],
  ['Ví & Dòng tiền','Một ví duy nhất. Thanh toán thẻ trừ ví, tiền back đã nhận cộng vào ví — tự động. Có thể thêm thu/chi thủ công.'],
  ['Tiết kiệm','Nhập các sổ tiết kiệm (kể cả sổ chấp thẻ). Chọn hình thức tái tục: không xoay vòng / xoay vòng gốc / xoay vòng gốc + lãi — hệ thống tự cập nhật khi đến hạn. Liên kết sổ ↔ thẻ là 1–1 và lọc theo ngân hàng + chủ sổ.'],
  ['Trả góp','Nhập khoản trả góp 0% / có phí chuyển đổi / có lãi. Bấm “Trả kỳ này” mỗi khi thanh toán. Dư nợ trả góp tính vào Tổng nợ.'],
  ['Dư nợ','Tổng hợp nợ theo thẻ: Kỳ trước (đã chốt sao kê) và Kỳ này (đang phát sinh). Thanh toán được trừ vào kỳ cũ nhất trước.'],
  ['Báo cáo','Chọn tháng/thẻ để xem chi tiêu, phí, hoàn, lãi ròng theo MCC và theo thẻ; bảng tiến độ mục tiêu kỳ hoàn tiền hiện tại (đã cà / cần quẹt, khớp với tab Thông báo). Mục “Lợi nhuận theo kỳ hoàn tiền”: gom lãi theo kỳ hoàn tiền của từng thẻ và ghi vào tháng kết thúc kỳ (VD sao kê ngày 20 → giao dịch 21/10–20/11 tính vào T11), kỳ chưa kết thúc ghi “tạm tính”, kèm biểu đồ so sánh với cách tính theo ngày cà. Mục “Doanh số thẻ”: xem doanh số theo 1, 2, 3, 6, 12 tháng gần nhất, theo năm hoặc chọn từ ngày… đến ngày…, so sánh với kỳ trước, chi tiết từng thẻ.'],
  ['Thông báo','Nhắc thanh toán: hiện khi còn đúng số ngày đã đặt (mặc định 5) và giữ nguyên đến khi bạn ghi nhận thanh toán đủ; đến hạn thì chuyển đỏ. Nhắc cà thẻ: hiện khi còn khoảng 20 ngày đến kỳ sao kê nếu chưa đủ “cần quẹt”.'],
  ['Cài đặt & sao lưu','Đổi số ngày nhắc, xuất/nhập file sao lưu JSON, xuất CSV, nạp/xóa dữ liệu mẫu. Dữ liệu lưu trên máy chủ nên mở cùng link trên điện thoại, máy ở nhà và cơ quan đều thấy như nhau.']];
  return hd('Hướng dẫn','Cách dùng từng tab')+`<div class="card guide">${G.map(g=>`<h3>${g[0]}</h3><p style="margin:0">${g[1]}</p>`).join('')}<h3>Bảo mật</h3><p style="margin:0">Sổ này không có ô CVV và không nên nhập số thẻ đầy đủ. Chỉ chia sẻ link với người bạn tin tưởng.</p></div>`;
}

<script>
'use strict';
/* ===== Khung hộp thoại & ô nhập ===== */
let MD=null;
function openModal(title,body,o={}){
  MD=o;
  $('#mo').innerHTML=`<div class="mo" data-a="mbg"><div class="md${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2><span>${esc(title)}</span><button type="button" class="btn ic1" data-a="mclose" aria-label="Đóng">${ico('x')}</button></h2><form id="mf" autocomplete="off">${body}${o.noFoot?'':`<div class="mf"><button type="button" class="btn" data-a="mclose">Hủy</button><button class="btn p" type="submit">${o.ok||'Lưu'}</button></div>`}</form></div></div>`;
  const f=$('#mf');kindToggle(f);if(!o.noFocus){const a=f.querySelector('input:not([type=hidden]):not([type=checkbox]),select');if(a&&matchMedia('(min-width:861px)').matches)a.focus()}
}
const closeModal=()=>{$('#mo').innerHTML='';MD=null};
const fld=(l,i,c='')=>`<div class="f ${c}"><label>${l}</label>${i}</div>`;
const inp=(n,v='',ph='',x='')=>`<input name="${n}" value="${esc(v)}" placeholder="${esc(ph)}" ${x}>`;
const minp=(n,v,x='')=>`<input class="mi" name="${n}" inputmode="numeric" value="${v===''||v==null?'':fmt(v)}" ${x}>`;
const sel=(n,o,v,x='')=>`<select name="${n}" ${x}>${o.map(a=>{const[k,l]=Array.isArray(a)?a:[a,a];return `<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
function readForm(f){const o={};for(const el of f.elements){if(!el.name)continue;if(el.type==='checkbox'){if(el.dataset.multi){o[el.name]=o[el.name]||[];if(el.checked)o[el.name].push(el.value)}else o[el.name]=el.checked}else if(el.type==='radio'){if(el.checked)o[el.name]=el.value}else o[el.name]=el.value}return o}
function kindToggle(f){const k=f.querySelector('[name=kind]');if(!k)return;f.querySelectorAll('[data-for]').forEach(e=>e.hidden=!e.dataset.for.split(',').includes(k.value))}
const two=(b,fn)=>{if(b.classList.contains('arm')){fn();return}b.classList.add('arm');b.dataset.old=b.innerHTML;b.innerHTML='Bấm lại để xóa';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.innerHTML=b.dataset.old}},3000)};

/* ===== Thẻ ===== */
/* Ô chủ thẻ: tự gõ hoặc chọn từ danh sách chủ thẻ đã có (ABC) */
const owners=()=>[...new Set(D.cards.map(c=>(c.owner||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{sensitivity:'base'}));
function ownerBox(attr,v){
  const L=owners();
  return `<div class="obx"><input ${attr} value="${esc(v||'')}" placeholder="Gõ tên hoặc chọn" autocomplete="off"><select class="obs" aria-label="Chọn chủ thẻ có sẵn" title="Chọn chủ thẻ có sẵn"${L.length?'':' disabled'}><option value="">Chọn ▾</option>${L.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;
}
document.addEventListener('change',e=>{
  const s=e.target;if(!s.classList||!s.classList.contains('obs')||!s.value)return;
  const i=s.previousElementSibling;i.value=s.value;s.value='';
  i.dispatchEvent(new Event('input',{bubbles:true}));
  const f=i.form;if(f&&f.linkedSavingId&&f.bank)f.linkedSavingId.innerHTML=savOpts(f.bank.value,i.value.trim(),f.linkedSavingId.value,(MD&&MD.cid)||'');
});
function savOpts(bank,owner,selId,cid){
  const L=D.savings.filter(s=>(!bank||s.bank===bank)&&(!owner||!s.owner||s.owner===owner)&&(!s.cardId||s.cardId===cid||s.id===selId));
  return '<option value="">— Không (tín chấp) —</option>'+L.map(s=>`<option value="${s.id}"${s.id===selId?' selected':''}>${esc(s.bank+' '+(s.name||'')+' · '+money(s.principal))}</option>`).join('');
}
function cardForm(c0){
  const c=c0||{},isNew=!c.id;
  if(isNew&&c.__clone)return cloneForm(c);
  openModal(isNew?'Thêm thẻ mới':'Sửa thẻ',`<p class="hint" style="margin:0 0 10px">Chỉ nhập 4 số cuối. Không nhập số thẻ đầy đủ hoặc CVV.</p><datalist id="dl-type"><option>Visa</option><option>Mastercard</option><option>JCB</option><option>Napas</option></datalist>
  <div class="fg">${fld('Ngân hàng',sel('bank',BANKS,c.bank||'VIB'))}${fld('Loại thẻ',inp('type',c.type,'Visa / Mastercard…','list="dl-type"'))}${fld('Tên thẻ',inp('name',c.name,'VD: MAX, Platinum','required'),'w2')}
  ${fld('4 số cuối',inp('last4',c.last4,'1234','inputmode="numeric" maxlength="4"'))}${fld('Số cuối thẻ phi vật lý / thẻ ảo (nếu có)',inp('alt4',c.alt4||'','VD: 8920 (nhiều số cách nhau dấu phẩy)'))}${fld('Hết hạn (MM/YY)',inp('expiry',c.expiry,'12/29','maxlength="5"'))}${fld('Chủ thẻ',ownerBox('name="owner"',c.owner))}${fld('Thiết bị chứa thẻ/tài khoản',inp('device',c.device,'VD: điện thoại 1'))}
  ${fld('Số TK nhận thanh toán (VietQR)',inp('vietqrAcc',c.vietqrAcc,'Số tài khoản/thẻ của ngân hàng','inputmode="numeric"'),'w2')}
  ${fld('Hạn mức (₫)',minp('limit',c.limit))}${fld('Hạn mức huy động (₫)',minp('mobLimit',c.mobLimit))}
  ${fld('Ngày sao kê (1–31)',inp('stmtDay',c.stmtDay,'20','inputmode="numeric" required'))}${fld('Ngày đến hạn TT (1–31)',inp('dueDay',c.dueDay,'15','inputmode="numeric" required'))}${fld('Thời gian bút toán (ngày)',inp('postDays',c.postDays??'','2','inputmode="numeric"'))}${fld('Phí hội viên / phí cố định (₫)',minp('memFee',c.memFee))}${fld('Thu mỗi (tháng)',inp('memMonths',c.memMonths||'','1','inputmode="numeric"'))}${fld('Hoàn tối đa chung cả thẻ/kỳ (₫) — trống nếu mỗi MCC có trần riêng',minp('capAll',c.capAll),'w2')}
  ${fld('Dư nợ ban đầu (₫)',minp('openingDebt',c.openingDebt))}
  ${fld('Kỳ hoàn tiền',sel('rcMode',[['stmt','Theo kỳ sao kê'],['month','Theo tháng dương lịch (từ ngày 1) — thẻ BIDV']],rcm(c)?'month':'stmt'),'w2')}
  ${fld('Vai trò',sel('role',[['main','Thẻ chính'],['sub','Thẻ phụ (dùng chung hạn mức)']],c.role||'main'))}
  ${fld('Chấp sổ tiết kiệm',`<select name="linkedSavingId">${savOpts(c.bank,c.owner,c.linkedSavingId,c.id)}</select>`,'w2')}</div>`,
  {cid:c.id||"",onSubmit:async o=>{
    const n={...c};delete n.__clone;Object.assign(n,{bank:o.bank,type:o.type.trim(),name:o.name.trim(),last4:o.last4.replace(/\D/g,'').slice(-4),alt4:String(o.alt4||'').split(/[^0-9]+/).filter(x=>x.length===4).join(', '),expiry:o.expiry.trim(),owner:o.owner.trim(),device:o.device.trim(),vietqrAcc:o.vietqrAcc.replace(/\s/g,''),limit:num(o.limit),mobLimit:num(o.mobLimit),stmtDay:Math.min(31,Math.max(1,num(o.stmtDay)||1)),dueDay:Math.min(31,Math.max(1,num(o.dueDay)||1)),postDays:num(o.postDays),memFee:num(o.memFee),memMonths:Math.max(1,num(o.memMonths)||1),capAll:num(o.capAll),openingDebt:num(o.openingDebt),role:o.role,rcMonth:o.rcMode==='month',rules:c.rules||[]});
    const old=c.linkedSavingId||'';n.linkedSavingId=o.linkedSavingId||'';
    await put('cards',n);
    for(const s of D.savings){if(s.cardId===n.id&&s.id!==n.linkedSavingId)await put('savings',{...s,cardId:''});if(s.id===n.linkedSavingId&&s.cardId!==n.id){await put('savings',{...s,cardId:n.id})}}
    closeModal();toast('Đã lưu thẻ');
  }});
}
function cloneCard(c){
  const k={};['bank','type','owner','device','vietqrAcc','limit','mobLimit','memFee','memMonths','capAll','stmtDay','dueDay','postDays','role','shared','rcMonth'].forEach(f=>{if(c[f]!==undefined)k[f]=c[f]});
  k.name=c.name||'';k.rules=JSON.parse(JSON.stringify(c.rules||[]));k.__clone=1;k.__src=c;cardForm(k);
}
/* Clone nhiều thẻ: phần chung lấy từ thẻ gốc, mỗi dòng là một thẻ mới */
const CLMAX=30;
function clRow(i,r={}){
  const f=(k,v,l,x='')=>`<div class="f"><label>${l}</label><input data-k="${k}" value="${esc(v||'')}" ${x}></div>`;
  return `<div class="clr" data-i="${i}"><span class="cln">${i+1}</span>${f('name',r.name,'Tên thẻ','required placeholder="VD: MAX"')}${f('last4',r.last4,'4 số cuối','inputmode="numeric" maxlength="4" placeholder="1234"')}${f('expiry',r.expiry,'Hết hạn','maxlength="5" placeholder="12/29"')}<div class="f"><label>Chủ thẻ</label>${ownerBox('data-k="owner"',r.owner)}</div>${f('device',r.device,'Thiết bị','placeholder="VD: điện thoại 1"')}</div>`;
}
function clRows(){return [...document.querySelectorAll('#clr .clr')].map(r=>{const g=k=>r.querySelector('[data-k="'+k+'"]').value.trim();return {name:g('name'),last4:g('last4').replace(/\D/g,'').slice(-4),expiry:g('expiry'),owner:g('owner'),device:g('device')}})}
function clSync(){
  const q=$('#clq'),box=$('#clr');if(!q||!box)return;
  const n=Math.min(CLMAX,Math.max(1,num(q.value)||1)),cur=clRows(),d=MD&&MD.clDef||{};
  if(n!==cur.length){const L=[];for(let i=0;i<n;i++)L.push(cur[i]||{name:d.name,owner:d.owner,device:d.device});box.innerHTML=L.map((r,i)=>clRow(i,r)).join('')}
  const b=$('#mf [type=submit]');if(b)b.textContent='Tạo '+n+' thẻ';
}
function cloneForm(c){
  const src=c.__src||{},def={name:c.name,owner:c.owner,device:c.device};

async function delCard(id){
  for(const t of D.txs.filter(t=>t.cardId===id))await del('txs',t.id);

/* ===== Nhập CSV giao dịch (định dạng xuất từ web cũ) ===== */
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));rows.push(r);r=[];f=''}else f+=c}
  if(f!==''||r.length){r.push(f.replace(/\r$/,''));rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()!==''));
}
const BKEY=s=>noAccent(s).toLowerCase().replace(/[^a-z]/g,'');
const BALIAS={vpb:'vpbank',sacom:'sacombank',tech:'techcombank'};

const BOT_TOOLS=[
 {name:'get_cards',description:'Danh sách TẤT CẢ thẻ kèm dư nợ, các kỳ sao kê chưa thanh toán (ky_chua_tra: ngày sao kê, hạn thanh toán, số nợ còn lại, số ngày đến hạn), hạn mức, mục tiêu chi tiêu kỳ hoàn tiền (muc_tieu_chi_tieu/da_chi_tieu/con_thieu/trang_thai_chi_tieu), cấu hình MCC. Lọc bằng filter (tên ngân hàng/tên thẻ/chủ thẻ/4 số cuối, không dấu cũng được); bỏ trống để lấy hết.',

 {name:'get_transactions',description:'Giao dịch. Tham số tùy chọn: card_filter (ngân hàng/tên/chủ thẻ/4 số cuối), kind (spend=chi tiêu, payment=thanh toán thẻ, cashback=hoàn tiền, points), from & to (YYYY-MM-DD), mcc, unassigned (true: chỉ giao dịch chưa gán thẻ), limit (mặc định 60, tối đa 200). Kết quả mới nhất trước, kèm tổng số khớp và tổng tiền.',
  inputSchema:{type:'object',properties:{card_filter:{type:'string'},kind:{type:'string'},from:{type:'string'},to:{type:'string'},mcc:{type:'string'},unassigned:{type:'boolean'},limit:{type:'number'}}},
  execute:async(a={})=>{const q=noAccent(a.card_filter||'').toLowerCase(),cm=Object.fromEntries(D.cards.map(c=>[c.id,c]));
   const L=D.txs.filter(t=>{const c=cm[t.cardId];if(a.kind&&t.kind!==a.kind)return false;if(a.unassigned&&t.cardId)return false;if(a.from&&String(t.ts).slice(0,10)<a.from)return false;if(a.to&&String(t.ts).slice(0,10)>a.to)return false;if(a.mcc&&!String(t.mcc||'').includes(a.mcc))return false;if(q&&!(c&&noAccent([c.bank,c.name,c.owner,c.last4].join(' ')).toLowerCase().includes(q)))return false;return true}).sort((x,y)=>String(y.ts).localeCompare(String(x.ts)));
   const lim=Math.min(200,Math.max(1,+a.limit||60));
   return{tong_so_khop:L.length,tong_tien:sum(L,t=>+t.amount||0),giao_dich:L.slice(0,lim).map(t=>{const v=V.tx[t.id]||{};return{thoi_gian:bdmy(t.ts),the:cardLbl(cm[t.cardId]),loai:t.kind,mcc:t.mcc||'',noi_dung:t.desc||'',so_tien:+t.amount||0,phi:Math.round(v.fee||0),hoan:Math.round(v.refund||0),lai:Math.round(v.profit||0),da_back:t.kind==='spend'?(t.backStatus==='done'?'đã back '+(t.backDate||''):'chưa back'):'',du_kien:t.status==='planned'}})}}},
 {name:'get_overview',description:'Tổng quan tài chính: số dư ví, tổng tài sản, tổng nợ, dòng tiền thực, tỷ lệ nợ/tài sản, hạn mức, các nhắc nhở thanh toán đang bật.',inputSchema:{type:'object',properties:{}},
  execute:async()=>({hom_nay:ymd(V.ref),so_du_vi:V.wallet,tong_tai_san:V.assets,tong_no:V.debt,no_the:V.debtCards,no_tra_gop:V.debtInst,dong_tien_thuc:V.net,ty_le_no_tren_tai_san:+(V.ratio*100).toFixed(1),han_muc_thuc_te:V.limit,huy_dong:V.mob,nhac_thanh_toan:V.pay.map(p=>({the:cardLbl(p.card),han:ymd(p.cy.due),so_ngay:p.days,so_tien:p.amount}))})},
 {name:'get_savings',description:'Các sổ tiết kiệm: ngân hàng, chủ sổ, gốc, lãi suất, ngày đáo hạn, thẻ liên kết (chấp sổ).',inputSchema:{type:'object',properties:{}},
  execute:async()=>V.sav.map(x=>({ngan_hang:x.s.bank,ten:x.s.name,chu_so:x.s.owner,goc:x.principal,lai_suat:x.s.rate,ngay_bat_dau:ymd(x.start),dao_han:ymd(x.end),con_ngay:x.left,dang_hoat_dong:x.active,the_chap:cardLbl(D.cards.find(c=>c.linkedSavingId===x.s.id))}))},
 {name:'get_installments',description:'Các khoản trả góp: tên, tổng, số tháng, đã trả, còn lại, kỳ tới (ngày, số tiền).',inputSchema:{type:'object',properties:{}},
  execute:async()=>V.inst.map(x=>({ten:x.i.name,tong:+x.i.total,so_thang:x.m,da_tra:x.paidN,con_lai:x.remain,ky_toi:x.next?{ky:x.next.k,ngay:ymd(x.next.date),so_tien:Math.round(x.next.amt)}:null}))},
 {name:'get_recurring_and_wallet',description:'Khoản định kỳ hằng tháng và các dòng thu/chi thủ công của ví.',inputSchema:{type:'object',properties:{}},
  execute:async()=>({dinh_ky:D.recur.map(r=>({ten:r.name,the:cardLbl(D.cards.find(c=>c.id===r.cardId)),so_tien:+r.amount,ngay:r.day,dang_chay:r.active!==false})),vi:D.wallet.slice(-40).map(w=>({ngay:w.date||w.ts,loai:w.kind,so_tien:+w.amount,ghi_chu:w.note||w.name||''}))})}
];
const BOT_RULES=()=>`Bạn là trợ lý tra cứu của ứng dụng MayBaoTheCRM (quản lý thẻ tín dụng cá nhân của anh Lâm). Hôm nay là ${ymd(V.ref)}. Chỉ dùng số liệu lấy từ các công cụ, tuyệt đối không bịa; chưa chắc thì gọi công cụ. Trả lời bằng tiếng Việt, ngắn gọn.
ĐỊNH DẠNG BẮT BUỘC: phản hồi cuối cùng là DUY NHẤT một đối tượng JSON, không kèm chữ nào khác, dạng:
{"answer":"1-2 câu tóm tắt kết quả","table":{"columns":["Cột 1","Cột 2"],"rows":[["..",".."]]},"note":"lưu ý ngắn nếu cần, hoặc rỗng"}
- Khi kết quả là danh sách thẻ/giao dịch/khoản thì BẮT BUỘC dùng table (mỗi dòng một mục). Câu hỏi chỉ cần một con số thì table = null.
- Tiền ghi dạng 1.234.000 ₫ (dấu chấm ngăn nghìn); ngày ghi dd/mm/yyyy. Mọi ô trong rows là chuỗi.
- Thẻ ghi dạng "Ngân hàng Tên thẻ *4số (Chủ thẻ)".
- Hỏi về thanh toán/dư nợ: dùng ky_chua_tra (các kỳ đã chốt sao kê mà chưa trả). Cột gợi ý: Thẻ | Số tiền cần thanh toán | Hạn thanh toán | Còn (ngày) ; sắp xếp hạn gần nhất lên trước; nếu có nhiều thẻ thì thêm dòng "Tổng". Số ngày âm = quá hạn.
- Hỏi về chi tiêu/mục tiêu: dùng trang_thai_chi_tieu, muc_tieu_chi_tieu, da_chi_tieu, con_thieu, han_giao_dich.
- Nếu không có mục nào khớp, nói rõ trong answer và table = null.
- Giao dịch chi tiêu chưa gán thẻ không thể tính vào thẻ nào; nếu liên quan, nhắc trong note.`;
function botParse(t){
  t=String(t||'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{const o=JSON.parse(t.slice(a,b+1));if(o&&typeof o==='object'&&('answer' in o||'table' in o))return o}catch(e){}}
  return{answer:t,table:null,note:''};
}
function botTable(tb){
  if(!tb||!Array.isArray(tb.columns)||!Array.isArray(tb.rows)||!tb.rows.length)return '';
  const isNum=v=>/^[\-+]?[\d.,]+\s*(₫|đ)?$/.test(String(v).trim());
  return `<div class="tw bt"><table><thead><tr>${tb.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r=>`<tr>${tb.columns.map((_,i)=>`<td class="${isNum(r[i])?'n':''}">${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---- Bộ máy trả lời cục bộ: KHÔNG dùng Claude, không tốn token ---- */
const BANK_ALIAS={sacom:'sacombank',sacombank:'sacombank',vpb:'vpbank',vpbank:'vpbank',tcb:'techcombank',techcom:'techcombank',techcombank:'techcombank',tp:'tpbank',tpbank:'tpbank',mb:'mbbank',msb:'msb',vcb:'vietcombank',vietcom:'vietcombank',ctg:'vietinbank',vietin:'vietinbank',hdb:'hdbank',ocb:'ocb',shb:'shb',vib:'vib',bidv:'bidv',acb:'acb',sea:'seabank'};
const nz=s=>noAccent(String(s||'')).toLowerCase();
function botFilters(q){
  const words=q.split(/[^a-z0-9]+/).filter(Boolean),f={banks:new Set(),owners:new Set(),last4:null,names:new Set()};
  D.cards.forEach(c=>{const b=nz(c.bank);if(b&&(q.includes(b)||words.some(w=>BANK_ALIAS[w]&&b.startsWith(BANK_ALIAS[w].slice(0,4))&&b.includes(BANK_ALIAS[w].slice(0,4)))))f.banks.add(c.id)});
  const m4=q.match(/\b(\d{4})\b/);if(m4&&D.cards.some(c=>c.last4===m4[1]))f.last4=m4[1];
  const owners=[...new Set(D.cards.map(c=>c.owner).filter(Boolean))];
  owners.forEach(o=>{const n=nz(o),last=n.split(' ').pop();if(q.includes(n)||(last.length>=3&&new RegExp('(^|[^a-z])'+last+'([^a-z]|$)').test(q)&&/(cua|chu|the cua|the)\b/.test(q)))f.owners.add(o)});
  const tokens=['max','infinite','premier','stepup','cake','amex','spark','uniq','evo','cashback','jcb','visa','mastercard','mdigi','platinum','utimate','well being','signature','online','360'];
  tokens.forEach(t=>{if(q.includes(t))f.names.add(t)});
  return f;
}
function botMatch(c,f,q){
  if(f.banks.size&&!D.cards.some(x=>x.id===c.id&&f.banks.has(x.id)))return false;
  if(f.owners.size&&![...f.owners].some(o=>nz(o)===nz(c.chu_the)))return false;
  if(f.last4&&c.bon_so_cuoi!==f.last4)return false;
  if(f.names.size&&![...f.names].every(t=>nz(c.ten_the+' '+c.ngan_hang).includes(t)))return false;
  return true;
}
function botScope(f){
  const p=[];if(f.banks.size)p.push([...new Set([...f.banks].map(id=>D.cards.find(c=>c.id===id).bank))].join('/'));if(f.names.size)p.push([...f.names].join(' ').toUpperCase());if(f.owners.size)p.push('của '+[...f.owners].join('/'));if(f.last4)p.push('*'+f.last4);return p.length?' '+p.join(' '):'';
}
const lab=c=>[c.ngan_hang,c.ten_the,c.bon_so_cuoi?'*'+c.bon_so_cuoi:'',c.chu_the?'('+c.chu_the+')':''].filter(Boolean).join(' ');
const dleft=n=>n<0?'quá hạn '+(-n)+' ngày':n===0?'hôm nay':n+' ngày';
function botPeriod(q){
  const t=ymd(V.ref),mk0=(y,m,d)=>ymd(new Date(y,m,d));let m;
  if(/hom nay/.test(q))return{from:t,to:t,label:'hôm nay'};
  if(/hom qua/.test(q)){const y=ymd(addD(V.ref,-1));return{from:y,to:y,label:'hôm qua'}}
  if(/tuan nay/.test(q)){const d=V.ref.getDay()||7,s=addD(V.ref,1-d);return{from:ymd(s),to:t,label:'tuần này'}}
  if(/thang truoc/.test(q)){const y=V.ref.getFullYear(),mo=V.ref.getMonth();return{from:mk0(y,mo-1,1),to:mk0(y,mo,0),label:'tháng trước'}}
  if(/thang nay/.test(q))return{from:mk0(V.ref.getFullYear(),V.ref.getMonth(),1),to:t,label:'tháng này'};
  if(m=q.match(/(\d+)\s*ngay/))return{from:ymd(addD(V.ref,-(+m[1]-1))),to:t,label:m[1]+' ngày gần nhất'};
  if(m=q.match(/thang\s*(\d{1,2})\b/)){const mo=+m[1]-1,y=V.ref.getFullYear();return{from:mk0(y,mo,1),to:mk0(y,mo+1,0),label:'tháng '+m[1]}}
  return null;
}
function botLocal(raw){
  const q=nz(raw),f=botFilters(q),sc=botScope(f),C=botCards().filter(c=>botMatch(c,f,q)),T=(columns,rows)=>({columns,rows});
  const has=re=>re.test(q);
  const nd=q.match(/(\d+)\s*ngay\s*(toi|nua|sap)?/);
  // 1. nợ / thanh toán
  if(has(/chua thanh toan|can thanh toan|phai tra|phai thanh toan|han thanh toan|den han|sap den han|qua han|ky chua tra|nop the|can tra/)){
    let rows=[];C.forEach(c=>c.ky_chua_tra.filter(k=>k.conNo>0).forEach(k=>rows.push({c,k})));
    if(has(/qua han/))rows=rows.filter(r=>r.k.soNgayDenHan<0);
    else if(nd&&has(/toi|nua|sap|trong/))rows=rows.filter(r=>r.k.soNgayDenHan<=+nd[1]);
    rows.sort((a,b)=>a.k.hanThanhToan.localeCompare(b.k.hanThanhToan));
    if(!rows.length)return{answer:'Không có thẻ'+sc+' nào còn nợ cần thanh toán'+(has(/qua han/)?' quá hạn':nd?' trong '+nd[1]+' ngày tới':'')+'. 🎉',table:null,note:''};
    const tot=sum(rows,r=>r.k.conNo),n=new Set(rows.map(r=>r.c.id)).size;
    return{answer:`Có ${n} thẻ${sc} chưa thanh toán, tổng cần thanh toán ${money(tot)}.`,table:T(['Thẻ chưa thanh toán','Số tiền cần thanh toán','Hạn thanh toán','Còn lại'],[...rows.map(r=>[lab(r.c),money(r.k.conNo),bdmy(r.k.hanThanhToan),dleft(r.k.soNgayDenHan)]),['Tổng',money(tot),'','']]),note:'Chỉ tính các kỳ đã chốt sao kê. Số ngày âm/“quá hạn” là đã trễ hạn.'};
  }
  if(has(/du no|\bno\b|no the|con no|tong no/)&&!has(/tai san|dong tien|so du|vi\b/)){
    const L=C.filter(c=>c.tong_du_no>0).sort((a,b)=>b.tong_du_no-a.tong_du_no);
    if(!L.length)return{answer:'Không có thẻ'+sc+' nào còn dư nợ.',table:null,note:''};
    const tot=sum(L,c=>c.tong_du_no);
    return{answer:`${L.length} thẻ${sc} còn dư nợ, tổng ${money(tot)}.`,table:T(['Thẻ','Nợ kỳ trước (cần TT)','Phát sinh kỳ này','Tổng dư nợ','Hạn mức'],[...L.map(c=>[lab(c),money(c.du_no_ky_truoc_chua_tra),money(c.phat_sinh_ky_nay),money(c.tong_du_no),money(c.han_muc)]),['Tổng',money(sum(L,c=>c.du_no_ky_truoc_chua_tra)),money(sum(L,c=>c.phat_sinh_ky_nay)),money(tot),'']]),note:''};
  }

  m=s.match(/\bngay\s*(\d{1,2})(?:\s*(?:\/|-|thang)\s*(\d{1,2}))?(?:\s*(?:\/|-|nam)\s*(\d{4}))?/);
  if(m){const dd=+m[1],mm=m[2]?+m[2]-1:now.getMonth(),yy=m[3]?+m[3]:now.getFullYear();if(dd>=1&&dd<=31){d=new Date(yy,mm,dd);if(!m[2]&&d>TODAY())d=new Date(yy,mm-1,dd);if(!m[3]&&m[2]&&d>TODAY())d=new Date(yy-1,mm,dd)}cut(m.index,m[0].length)}
  let hh=now.getHours(),mi=now.getMinutes();
  m=s.match(/\b(?:luc\s*)?(\d{1,2})\s*(?:h|gio)\s*(\d{1,2})?\b(?:\s*phut)?/);
  if(m&&+m[1]<24){hh=+m[1];mi=m[2]?+m[2]:0;cut(m.index,m[0].length)}
  d=d||TODAY();R.ts=ymd(d)+'T'+pad(hh)+':'+pad(mi);
  /* phí: phần sau chữ "phí" */
  m=s.match(/\b(khong|ko|0)\s*(mat\s*)?phi\b|\bphi\s*(?:la\s*)?(0|khong)\b(?!\s*[.,]?\d)/);
  if(m){R.feePct=0;R.feeFix=0;cut(m.index,m[0].length)}
  else if((m=s.match(/\bphi\b/))){
    const st=m.index,rest=s.slice(st+3),stop=rest.search(/\b(mcc|ngay|the|cua|giao dich|gd|ca|quet|so tien|luc)\b/),seg=stop<0?rest:rest.slice(0,stop);
    const p=seg.match(/(\d+(?:[.,]\d+)?)\s*(%|phan tram)/);
    if(p){R.feePct=pnum(p[1])}
    else{const mv=vMoney(seg);if(mv&&mv.v>=1000){R.feeFix=mv.v;R.feePct=0}else{const n=seg.match(/\d+(?:[.,]\d+)?/);if(n){const v=pnum(n[0]);if(v<=10)R.feePct=v;else{R.feeFix=v<1000?v*1000:v;R.feePct=0}}}}
    cut(st,3+(stop<0?rest.length:stop));
  }
  /* số tiền giao dịch */
  const mv=vMoney(s);if(mv){R.amount=mv.v;cut(mv.i,mv.len)}
  /* tìm thẻ */
  vCard(s,R);
  if(R.card){const rs=R.card.rules||[];if(R.mcc&&!rs.some(r=>String(r.code)===R.mcc))R.warn.push('Thẻ này chưa cấu hình MCC '+R.mcc+' — vẫn lưu theo mã đã nói, không tính hoàn.');if(!R.mcc)R.mcc=rs[0]?String(rs[0].code):''}
  return R;
}
function vCard(s,R){
  const words=s.split(/[^a-z0-9]+/).filter(Boolean),has=w=>words.includes(w);
  const STOP=new Set('the cua giao dich gd ca quet chi tieu hom nay qua ngay phi so tien voi cho la luc mcc noi dung vao cai khoan trieu tr nghin ngan k ty dong vnd va o'.split(' '));
  let L=D.cards.slice().sort((a,b)=>String(a.bank).localeCompare(String(b.bank),'vi')||String(a.name||'').localeCompare(String(b.name||''),'vi'));
  const step=(lbl,f,need)=>{const x=L.filter(f);if(x.length)L=x;else if(need){R.warn.push(lbl);L=[]}};
  /* ngân hàng */
  const bankHit=c=>{const b=nz(c.bank).replace(/\s+/g,' ');if(!b)return false;if(b.includes(' '))return s.includes(b)||s.includes(b.replace(/ /g,''));if(has(b))return true;return Object.entries(typeof BANK_ALIAS!=='undefined'?BANK_ALIAS:{}).some(([k,v])=>has(k)&&(v===b||v.startsWith(b)||b.startsWith(v.slice(0,4))))};
  const banks=[...new Set(D.cards.filter(bankHit).map(c=>c.bank))];
  const said=(typeof BANKS!=='undefined'?BANKS:[]).map(nz).filter(b=>b&&b!=='khac'&&(b.includes(' ')?s.includes(b):has(b))).concat(Object.keys(typeof BANK_ALIAS!=='undefined'?BANK_ALIAS:{}).filter(has));
  if(!banks.length&&said.length){R.warn.push('Không có thẻ của ngân hàng “'+said[0].toUpperCase()+'”');R.cands=[];R.card=null;return}
  if(banks.length)step('Không có thẻ của ngân hàng '+banks.join('/'),bankHit,true);
  /* loại thẻ */
  const TY=['jcb','visa','master','mastercard','napas','amex','unionpay'].filter(has);
  if(TY.length&&L.length)step('Không có thẻ '+TY.join('/').toUpperCase()+' phù hợp',c=>TY.some(t=>nz((c.type||'')+' '+(c.name||'')).includes(t)),true);
  /* 4 số cuối */
  if(R.last4&&L.length)step('Không có thẻ đuôi '+R.last4,c=>String(c.last4||'')===R.last4,true);
  /* chủ thẻ: ưu tiên cụm sau "của" */
  const om=s.match(/\bcua\s+([a-z ]+?)(?=\s+(?:giao dich|gd|ca|quet|chi|so tien|the|phi|ngay|mcc|\d)|\s*$|\s{2,})/),oph=om?om[1].trim().split(' ').filter(w=>w&&!STOP.has(w)):[];
  const ownTok=c=>nz(c.owner).split(/\s+/).filter(Boolean);
  if(L.length){
    const pool=oph.length?oph:words.filter(w=>!STOP.has(w)&&w.length>1&&!/^\d+$/.test(w));
    const sc=c=>{const t=ownTok(c);let n=0;pool.forEach(w=>{if(t.includes(w))n++});if(oph.length&&nz(c.owner).includes(oph.join(' ')))n+=2;return n};
    const best=Math.max(0,...L.map(sc));
    if(best>0)L=L.filter(c=>sc(c)===best);else if(oph.length){R.warn.push('Không tìm thấy chủ thẻ “'+oph.join(' ')+'”');L=[]}
  }
  /* tên thẻ (Infinite, Max, Cashback…) để phân biệt thêm */
  if(L.length>1){const sc=c=>nz(c.name).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!['jcb','visa','master','mastercard','napas'].includes(w)&&has(w)).length,b=Math.max(...L.map(sc));if(b>0)L=L.filter(c=>sc(c)===b)}
  R.cands=L;R.card=L.length===1?L[0]:null;
}

  const fp=R.feePct!=null?R.feePct:(r?+r.feePct||0:0),ff=R.feeFix!=null?R.feeFix:(r?+r.feeFix||0:0),a=R.amount||0,fee=a*fp/100+ff,rf=r?a*(+r.pct||0)/100:0;

  <div class="f"><label>Số tiền ${a?'':'<span class="er">— chưa nghe rõ</span>'}</label><input class="mi" id="vamt" inputmode="numeric" value="${a?fmt(a):''}"></div>

  <div class="f"><label>Phí</label><div class="hint" style="padding-top:8px">${R.feePct!=null||R.feeFix!=null?'<b>Theo câu nói:</b> ':'Theo MCC: '}${pc(fp)}${ff?' + '+fmt(ff)+' ₫':''}</div></div>
  ${R.desc?`<div class="f w2"><label>Nội dung</label><div>${esc(R.desc)}</div></div>`:''}
  </div>
  ${a?`<div class="hint" style="margin-top:8px">Phí ≈ <b>${money(fee)}</b> · Back ≈ <b>${money(a-fee)}</b> · Hoàn (chưa tính trần) ≈ <b class="pos">${money(rf)}</b>${R.status==='planned'?' · '+chip('Dự kiến','w'):''}</div>`:''}
  ${R.warn.length?`<div class="hint er" style="margin-top:6px">${R.warn.map(esc).join('<br>')}</div>`:''}
  <div class="row" style="margin-top:10px">${btn('Lưu & nói tiếp','vnext',null,'s','plus')}</div></div>`;
}
/* đọc lại giá trị đang hiện trên form (người dùng có thể sửa tay) */

    d.onState(({state,reason})=>{vMicDraw();if(state==='idle'&&reason&&!['stopped','viewer_stopped','hidden'].includes(reason)){const m={not_granted:'Micro bị chặn — cho phép trong menu Permissions của trang, hoặc gõ tay.',unavailable:'Tài khoản/thiết bị này chưa hỗ trợ nhận giọng nói.',rate_limited:'Đang có quá nhiều phiên nghe, thử lại sau ít giây.',dismissed:'Bạn chưa cho phép micro.'};toast(m[reason]||'Micro gặp lỗi, thử lại.')}});

}

<script>
'use strict';
/* ===== Bộ đọc thông báo / email giao dịch ngân hàng ===== */
const NTF_BANKS=[['sacombank',/sacom|sacombank ?pay/],['VIB',/\bvib\b|myvib/],['BIDV',/bidv|smartbanking/],['VPBank',/vpbank|vpb neo|\bneo\b/],['Techcombank',/techcombank|\btcb\b/],['TPBank',/tpbank/],['Vietcombank',/vietcombank|\bvcb\b/],['VietinBank',/vietinbank|ipay/],['HDBank',/hdbank/],['MB',/\bmb ?bank\b|\bmbbank\b/],['ACB',/\bacb\b/],['Shinhan',/shinhan/],['HSBC',/hsbc/],['OCB',/\bocb\b/],['MSB',/\bmsb\b/],['SHB',/\bshb\b/],['SeABank',/seabank/],['Eximbank',/eximbank/],['LPBank',/lpbank/],['Cake',/\bcake\b/]];
const ntfNz=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function ntfAmt(s){
  s=String(s).trim();
  let m=s.match(/^(\d{1,3}(?:([.,])\d{3})+)(?:([.,])(\d{1,2}))?$/);
  if(m&&(!m[3]||m[3]!==m[2]))return +m[1].replace(/[.,]/g,'');
  m=s.match(/^(\d+)(?:[.,](\d{1,2}))?$/);
  if(m)return +m[1];
  return +s.replace(/[^\d]/g,'')||0;
}
function ntfParse(txt,meta={}){
  const raw=String(txt||'').normalize('NFC').replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
  const one=raw.replace(/\s*\n\s*/g,' ');
  const n=ntfNz(one);
  const r={raw:raw.slice(0,1500),kind:'other',amount:0,sign:0,last4:'',cardName:'',merchant:'',ts:'',bank:''};
  const bh=ntfNz((meta.app||'')+' '+(meta.from||'')+' '+one);
  for(const [b,re] of NTF_BANKS)if(re.test(bh)){r.bank=b==='sacombank'?'Sacombank':b;break}
  // thời gian trong nội dung
  let m=one.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]*(?:luc |lúc )?(\d{1,2})[:h](\d{2})(?::(\d{2}))?/i)||one.match(/(\d{1,2}):(\d{2})(?::\d{2})? (\d{1,2})\/(\d{1,2})\/(\d{4})/);
  const p2=x=>String(x).padStart(2,'0');
  if(m){if(m[0].indexOf('/')<m[0].indexOf(':'))r.ts=`${m[3]}-${p2(m[2])}-${p2(m[1])}T${p2(m[4])}:${m[5]}`;else r.ts=`${m[5]}-${p2(m[4])}-${p2(m[3])}T${p2(m[1])}:${m[2]}`}
  else if((m=one.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)))r.ts=`${m[3]}-${p2(m[2])}-${p2(m[1])}`;
  // phân loại
  const isStmt=/du no cuoi ky|sao ke|tong du no|du no hien tai|so tien thanh toan toi thieu/.test(n);
  const isCard=/\bthe\b|\bcard\b|\bvisa\b|master|\bjcb\b|amex|credit/.test(n);
  const isAcct=/\btk\b|tai khoan|\bstk\b/.test(n)&&/\bps\b|so du|\bsd\b|bien dong/.test(n)&&!/\bthe\b.*giao dich/.test(n);
  const spendKw=/giao dich|\bgd\b|thanh toan|chi tieu|da chi|tru tien|purchase|transaction/;
  const refundKw=/hoan tien|hoan tra|refund|tra lai|huy giao dich|dao giao dich/;
  if(isStmt)r.kind='stmt';
  else if(isAcct&&!/\bthe\b[^.]{0,40}\d{4}[^.]{0,20}giao dich/.test(n))r.kind='acct';
  else if(isCard&&/thanh toan (?:\S+ ){0,4}vao the|thanh toan du no|tra no the|cam on quy khach da thanh toan/.test(n))r.kind='payment';
  else if(isCard&&refundKw.test(n))r.kind='refund';
  else if(isCard&&spendKw.test(n))r.kind='spend';
  // số tiền
  const NUM='([+-]?\\s?\\d{1,3}(?:[.,]\\d{3})+(?:[.,]\\d{1,2})?(?![\\d])|[+-]?\\d{4,}(?:[.,]\\d{1,2})?(?![\\d]))';
  const cur='\\s*(?:d\\b|đ|vnd|vnđ|dong)';
  const tries=r.kind==='stmt'?[new RegExp('(?:tong du no cuoi ky|du no cuoi ky|tong du no|du no)[^\\d+-]{0,12}'+NUM,'i')]:[
    new RegExp('(?:giao dich|\\bgd\\b|so tien|thanh toan|chi tieu|hoan tien|hoan tra|\\bps\\b)[^\\d+-]{0,25}'+NUM,'i'),
    new RegExp(NUM+cur,'i')];
  for(const re of tries){const k=n.match(re);if(k){const v=k[1].replace(/\s/g,'');r.sign=v[0]==='-'?-1:v[0]==='+'?1:0;r.amount=ntfAmt(v.replace(/^[+-]/,''));if(r.amount)break}}
  // thẻ: đoạn sau chữ "thẻ"
  const ti=n.search(/\bthe\b|\bcard\b/);
  if(ti>=0){
    let seg=one.slice(ti,ti+90),segN=n.slice(ti,ti+90);
    const cut=segN.search(/giao dich|\bgd\b|thanh toan|\. |so tk|hoan|da duoc|tai /);
    if(cut>0){seg=seg.slice(0,cut);segN=segN.slice(0,cut)}
    const d4=[...segN.matchAll(/(?<![\d\/])(?:[x*•]+\s?)?(\d{4})(?![\d\/])/g)].map(x=>x[1]).filter(x=>!/^(19|20)\d\d$/.test(x)||segN.includes('*'+x)||segN.includes('x'+x));
    if(d4.length)r.last4=d4[d4.length-1];
    r.cardName=seg.replace(/^(thẻ|the|card)\s*/i,'').replace(/[x*•]*\d{4}(\s*-\s*[x*•]*\d{4})?/g,' ').replace(/[,:.]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
  }
  if(!r.last4){const k=n.match(/(?:[x*•]{2,}|\bx)(\d{4})\b/);if(k)r.last4=k[1]}
  // điểm bán
  const mi=n.search(/ tai /);
  if(mi>=0&&r.kind!=='stmt'){
    let s=one.slice(mi+5);const sn=n.slice(mi+5);
    const e=sn.search(/\. |\s+(?:luc|vao luc|ngay|so du|sd|han muc|hm con|con lai|ma gd|ref)\b|\s-\s|;|$/);
    if(e>0)s=s.slice(0,e);

/* Khớp thẻ: ưu tiên 4 số cuối, sau đó tên thẻ; thu hẹp theo ngân hàng và chủ thẻ */
const NTF_SYN={vs:'visa',cre:'credit',mc:'mastercard',plat:'platinum',cb:'cashback',inf:'infinite',sig:'signature'};
function ntfTok(s){return ntfNz(s).split(/[^a-z0-9]+/).filter(w=>w.length>1&&!/^(the|card|tin|dung|so)$/.test(w)).map(w=>NTF_SYN[w]||w)}
function ntfMatch(p,cards,owner){
  let L=cards.slice();
  if(p.bank){const b=ntfNz(p.bank).replace(/[^a-z]/g,'');const L2=L.filter(c=>ntfNz(c.bank).replace(/[^a-z]/g,'').startsWith(b.slice(0,5)));if(L2.length)L=L2}
  const ow=ntfNz(owner||'').trim();
  const byOwner=A=>{if(!ow)return A;const B=A.filter(c=>{const o=ntfNz(c.owner||'').trim();return o&&(o===ow||o.includes(ow)||ow.includes(o)||o.split(' ').pop()===ow.split(' ').pop())});return B.length?B:A};
  if(p.last4){
    const has4=c=>String(c.last4||'')===p.last4||String(c.alt4||'').split(/[^0-9]+/).includes(p.last4);
    let A=L.filter(has4);
    if(!A.length)A=cards.filter(has4);
    if(A.length>1)A=byOwner(A);
    if(A.length===1)return{cardId:A[0].id,how:'4 số cuối'};
    if(A.length>1)return{cardId:'',how:'nhiều thẻ cùng 4 số cuối',cands:A.map(c=>c.id)};
  }
  if(p.cardName){
    const t=ntfTok(p.cardName);if(!t.length)return{cardId:'',how:''};
    const sc=c=>{const h=ntfTok([c.name,c.type,c.bank].join(' '));return t.filter(w=>h.includes(w)).length};
    let A=L.map(c=>({c,s:sc(c)})).filter(x=>x.s>0&&x.s/t.length>=0.5&&(x.s>=2||t.length===1));
    const best=Math.max(0,...A.map(x=>x.s));A=A.filter(x=>x.s===best).map(x=>x.c);
    if(A.length>1)A=byOwner(A);
    if(A.length===1)return{cardId:A[0].id,how:'tên thẻ'+(ow?' + chủ thẻ':'')};
    if(A.length>1)return{cardId:'',how:'nhiều thẻ khớp tên',cands:A.map(c=>c.id)};
  }
  return{cardId:'',how:''};
}

/* ===== Đọc bill chụp màn hình app ngân hàng (OCR chạy ngay trên máy — ảnh không gửi đi đâu, không tốn token) ===== */
const BILL_LIB='https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
let BILL_W=null;
async function billWorker(msg){
  if(BILL_W)return BILL_W;
  if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src=BILL_LIB;s.onload=ok;s.onerror=()=>no(new Error('Không tải được bộ đọc ảnh — kiểm tra mạng rồi thử lại'));document.head.appendChild(s)});
  msg('Đang tải bộ đọc chữ tiếng Việt (chỉ lần đầu, ~5 MB)…');
  BILL_W=await Tesseract.createWorker('vie+eng',1,{logger:m=>{if(m.status==='recognizing text')msg('Đang đọc chữ trên ảnh… '+Math.round((m.progress||0)*100)+'%')}});

}
/* Ảnh nền tối (app BIDV) → đảo màu, tăng tương phản để đọc chính xác */
async function billPrep(file,th){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Không mở được ảnh '+(file.name||'')));i.src=url});
    let w=img.naturalWidth,h=img.naturalHeight;const k=w>1500?1500/w:w<800?2:1;w=Math.round(w*k);h=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data;let s=0;
    for(let i=0;i<p.length;i+=4){const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=g;s+=g}
    const inv=s/(p.length/4)<128;
    /* th: lượt 2 cho màn BIDV “Giao dịch thành công” — tách đen/trắng để chữ xám/vàng trên nền hoa văn đọc đúng ngày, nhãn–giá trị cùng dòng */
    for(let i=0;i<p.length;i+=4){let v=inv?255-p[i]:p[i];v=th?(v<th?0:255):Math.max(0,Math.min(255,(v-60)*1.6));p[i]=p[i+1]=p[i+2]=v;p[i+3]=255}
    x.putImageData(d,0,0);return cv;
  }finally{URL.revokeObjectURL(url)}
}
/* Sacombank Pay: màn “Thông báo” — 3 mẫu: tiền vào thẻ (thanh toán / hoàn tiền), giao dịch thẻ, nhắc sao kê */
function sacomParse(raw,t){
  const one=t.replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ');
  if(!/sacombank|chuyen [\d.,]+ ?vn\S* v\S{1,2}o th|tong du no cuoi ky|the \S.{0,40}?\d{4} giao dich [\d.,]+ ?vnd tai/i.test(one))return null;
  const p2=x=>String(x).padStart(2,'0'),yy=y=>String(y).length===2?'20'+y:y;
  const base={bank:'Sacombank',amount:0,sign:0,last4:'',cardName:'',merchant:'',ts:'',appr:'',cur:'VND',raw:raw.slice(0,1500)};
  let m=one.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4}) (\d{1,2}):(\d{2}) Chuyen ([\d.,]+) ?VN\S* v\S{1,2}o th\S? (.+?) (\d{4}) ?- ?(.+)$/i);
  if(m){const content=m[9].trim(),cz=ntfNz(content);
    return{...base,kind:/hoan tien|hoan tra|refund|cashback|tra lai/.test(cz)?'refund':'payment',sign:1,amount:ntfAmt(m[6]),cardName:m[7].trim(),last4:m[8],merchant:content.slice(0,80),ts:`${yy(m[3])}-${p2(m[2])}-${p2(m[1])}T${p2(m[4])}:${m[5]}`,sure:true,why:''}}
  m=one.match(/Ngay (\d{1,2})\/(\d{1,2})\/(\d{2,4}) (\d{1,2}):(\d{2}) th\S? (.+?) (\d{4}) giao dich ([\d.,]+) ?VND tai (.+?)\. ?Ma giao dich:? ?(\d+)/i)||one.match(/Ngay (\d{1,2})\/(\d{1,2})\/(\d{2,4}) (\d{1,2}):(\d{2}) th\S? (.+?) (\d{4}) giao dich ([\d.,]+) ?VND tai (.+?)(?:\. |$)()/i);
  if(m){const cz=ntfNz(m[9]+' '+one.slice(0,200));
    return{...base,kind:/hoan tien|hoan tra|refund|huy giao dich/.test(cz)?'refund':'spend',sign:-1,amount:ntfAmt(m[8]),cardName:m[6].trim(),last4:m[7],merchant:m[9].trim().slice(0,80),appr:m[10]||'',ts:`${yy(m[3])}-${p2(m[2])}-${p2(m[1])}T${p2(m[4])}:${m[5]}`,sure:true,why:''}}
  m=one.match(/tong du no cuoi ky:? ?([\d.,]+)/i);
  if(m){const cards=[...one.matchAll(/(\d{4}) ?- ?(\d{4})(?!\d)/g)].map(x=>x[2]),mn=one.match(/toi thieu:? ?([\d.,]+)/i),du=one.match(/han thanh to\S{1,2}n:? ?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i),hd=one.match(/\d{1,2}:\d{2}:\d{2} (\d{1,2})\/(\d{1,2})\/(\d{4})/);
    let dueDate='';if(du){let y=du[3]?yy(du[3]):hd?+hd[3]:new Date().getFullYear();if(!du[3]&&hd&&+du[2]<+hd[2])y++;dueDate=`${y}-${p2(du[2])}-${p2(du[1])}`}
    const amount=ntfAmt(m[1]),minDue=mn?ntfAmt(mn[1]):0;
    return{...base,kind:'stmt',amount,minDue,dueDate,last4:cards.length===1?cards[0]:'',cards,ts:hd?`${hd[3]}-${p2(hd[2])}-${p2(hd[1])}`:'',txType:'Nhắc thanh toán'+(dueDate?' · hạn '+dueDate:''),
      note:'Sao kê Sacombank'+(cards.length>1?' chung '+cards.length+' thẻ …'+cards.join(', …'):'')+': tổng dư nợ cuối kỳ '+fmt(amount)+' ₫'+(minDue?' · tối thiểu '+fmt(minDue)+' ₫':'')+(dueDate?' · hạn '+dueDate.split('-').reverse().join('/'):''),sure:true,why:''}}
  return null;
}
/* BIDV SmartBanking: màn “Giao dịch thành công” ngay sau khi làm lệnh trong app.
   - Thanh toán thẻ (trả nợ thẻ): có Tài khoản nguồn + Số thẻ + Tên chủ thẻ, KHÔNG có “Thanh toán cho” / “Tên điểm bán”
   - Chi tiêu bằng thẻ trong app: có Số thẻ + Thanh toán cho + Tên điểm bán */
function bidvRcptParse(raw,t){
  const one=t.replace(/\s+/g,' ');
  /* OCR hay đọc sót dòng “Giao dịch thành công” → nhận diện bằng bất kỳ dấu hiệu nào của màn này + số thẻ che */
  if(/so\s*chuan\s*chi|ngay\s*quyet\s*toan/i.test(one))return null;
  if(!/giao dich thanh cong|tham chieu|luu anh|giao dich moi|ve trang chu|gioi thieu kh|khoan nguon|thanh toan cho|ten diem ban|ten chu the/i.test(one))return null;
  const cm=one.match(/(\d{4,8})\s*[*xX•]{2,}\s*(\d{4})(?!\d)/);
  if(!cm)return null;
  const p2=x=>String(x).padStart(2,'0');
  const dm=one.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})\s*(\d{1,2}):(\d{2})(?::\d{2})?/)||one.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})()()/);
  const dok=dm&&+dm[1]>=1&&+dm[1]<=31&&+dm[2]>=1&&+dm[2]<=12;
  const ts=dok?`${dm[3]}-${p2(dm[2])}-${p2(dm[1])}`+(dm[4]?`T${p2(dm[4])}:${dm[5]}`:''):'';
  /* số tiền: số có dấu phân cách hàng nghìn đứng trước VND (không lấy nhầm số tài khoản nguồn) */
  const head=one.split(/so the|tai khoan nguon|khoan nguon/i)[0];
  const am=head.match(/(\d{1,3}(?:[.,]\s?\d{3})+)\s*V\s*N\s*D/i)||one.match(/(\d{1,3}(?:[.,]\s?\d{3})+)\s*V\s*N\s*D/i)||head.match(/(\d{1,3}(?:[.,]\d{3})+)/);
  const amount=am?ntfAmt(am[1].replace(/\s/g,'')):0;
  const STOP=/\s*(?:ten\s*diem\s*ban|thanh\s*toan\s*cho|phi\s*giao\s*dich|so\s*tham\s*chieu|ten\s*chu\s*the|so\s*the|tai\s*khoan\s*nguon|noi\s*dung|chia\s*se|luu\s*anh)\b.*$/i;
  const lineAfter=lab=>{const m=t.match(new RegExp(lab+'\\s*:?[ \\t]*([^\\n]*)','i'));return m?m[1].replace(STOP,'').trim():''};
  const payTo=lineAfter('thanh\\s*toan\\s*cho'),shop=lineAfter('ten\\s*diem\\s*ban');
  const holder=(lineAfter('ten\\s*chu\\s*the').match(/[A-Z]{2,}(?: [A-Z]{2,})*/)||[''])[0];
  const ref=(one.match(/so tham chieu:? ?([A-Za-z0-9]{4,}-?[A-Za-z0-9]*)/i)||[])[1]||'';
  const isPay=!payTo&&!shop&&/khoan nguon|ten chu the/i.test(one);
  const merchant=isPay?'':(payTo||shop).slice(0,80);
  const why=[];
  if(!amount)why.push('không đọc được số tiền');else if(amount<1000)why.push('số tiền bất thường');
  if(!ts)why.push('không đọc được ngày');
  if(!isPay&&!merchant)why.push('không rõ loại giao dịch');
  return{bank:'BIDV',rcpt:true,dateRaw:dm?dm[0]:'',kind:isPay?'payment':'spend',sign:isPay?1:-1,amount,last4:cm[2],first:cm[1],cardName:'',merchant,content:isPay?'Thanh toán thẻ'+(holder?' · '+holder:''):[payTo,shop].filter(Boolean).join(' · '),holder,ts,appr:ref,cur:'VND',raw:raw.slice(0,1500),sure:!why.length,why:why.join(', ')};
}
/* Gộp 2 lượt đọc màn BIDV “Giao dịch thành công”: có “Thanh toán cho/Tên điểm bán” ở lượt nào thì là chi tiêu; ngày lấy lượt đọc rõ hơn */
function billMerge(p,q){
  if(!q||!q.rcpt||(q.last4&&p.last4&&q.last4!==p.last4))return p;
  const good=x=>x.ts&&/\d{4}\s+\d{1,2}:\d{2}/.test(x.dateRaw||'');
  const r={...p};
  if(q.ts&&(!p.ts||good(q)&&!good(p)))r.ts=q.ts;else if(q.ts&&p.ts&&q.ts.slice(0,10)!==p.ts.slice(0,10)&&good(q))r.ts=q.ts;
  if(!r.amount&&q.amount)r.amount=q.amount;
  if(p.amount&&q.amount&&p.amount!==q.amount)r.amountAlt=q.amount;
  const m=p.merchant||q.merchant;
  if(m){r.kind='spend';r.sign=-1;r.merchant=m;r.content=p.merchant?p.content:q.content}
  else{r.kind=(p.kind==='payment'||q.kind==='payment')?'payment':p.kind;r.sign=r.kind==='payment'?1:-1}
  r.holder=p.holder||q.holder;r.appr=p.appr||q.appr;
  const why=[];
  if(!r.amount)why.push('không đọc được số tiền');else if(r.amount<1000)why.push('số tiền bất thường');
  if(r.amountAlt)why.push('2 lượt đọc ra số tiền khác nhau ('+fmt(r.amount)+' / '+fmt(r.amountAlt)+')');
  if(!r.ts)why.push('không đọc được ngày');
  r.why=why.join(', ');r.sure=!why.length;delete r.amountAlt;
  if(r.kind==='payment'){r.merchant='';r.content='Thanh toán thẻ'+(r.holder?' · '+r.holder:'')}
  return r;
}
/* Đọc chữ của bill → giao dịch. BIDV SmartBanking (màn “Chi tiết giao dịch” thẻ tín dụng) đọc chắc chắn; ngân hàng khác dùng bộ đọc thông báo chung */
function billParse(txt){
  const raw=String(txt||'').normalize('NFC').replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
  const A=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
  const t=A(raw).replace(/[–—−]/g,'-');
  const L='(?:so\\s*tien\\s*giao\\s*dich|so\\s*tien\\s*quy\\s*doi|noi\\s*dung\\s*giao\\s*dich|ngay\\s*giao\\s*dich|ngay\\s*quyet\\s*toan|so\\s*the|so\\s*chuan\\s*chi|tao\\s*tra\\s*soat)';
  const after=(lab)=>{const m=t.match(new RegExp(lab+'\\s*:?\\s*([\\s\\S]*?)(?='+L+'|$)','i'));return m?m[1].trim():''};
  const AMT=/([+-]?)\s*(\d{1,3}(?:[.,]\s?\d{3})+|\d{4,})(?:[.,]\d{1,2}(?!\d))?\s*(VND|USD|EUR|JPY|SGD|THB|KRW|CNY|GBP|AUD|HKD|TWD)?/;
  const am=s=>{s=String(s).replace(/(\d)[OoD]/g,'$10').replace(/(\d)[OoD]/g,'$10').replace(/[Oo](\d)/g,'0$1');const m=s.match(AMT);return m?{sign:m[1]==='-'?-1:m[1]==='+'?1:0,v:ntfAmt(m[2].replace(/\s/g,'')),cur:m[3]||'VND'}:null};
  {const sc=sacomParse(raw,t);if(sc)return sc}
  {const br=bidvRcptParse(raw,t);if(br)return br}
  const isBidv=/so\s*chuan\s*chi|ngay\s*quyet\s*toan|quy\s*doi\s*noi\s*te/i.test(t);
  if(!isBidv){
    const p=ntfParse(raw,{date:''});
    return{...p,raw:raw.slice(0,1500),sure:false,generic:true,why:'Mẫu bill chưa hỗ trợ đọc chắc chắn — kiểm tra lại'};
  }
  const p2=x=>String(x).padStart(2,'0');
  const a1=am(after('so\\s*tien\\s*giao\\s*dich')),a2=am(after('so\\s*tien\\s*quy\\s*doi(?:\\s*noi\\s*te)?'));
  const dOf=s=>{const m=String(s).match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);return m?`${m[3]}-${p2(m[2])}-${p2(m[1])}`:''};
  const date=dOf(after('ngay\\s*giao\\s*dich')),settle=dOf(after('ngay\\s*quyet\\s*toan'));
  const cm=after('so\\s*the').match(/(\d{4,8})\s*[*xX•.·]{2,}\s*(\d{4})/)||t.match(/(\d{4,8})\s*[*xX•]{3,}\s*(\d{4})/);
  const ap=(after('so\\s*chuan\\s*chi').match(/^([A-Z0-9]{4,12})\b/i)||[])[1]||'';
  /* nội dung: nối các dòng bị ngắt (dòng kết thúc bằng - hoặc _ thì nối liền) */
  const content=after('noi\\s*dung\\s*giao\\s*dich').split(/\n+/).map(s=>s.trim()).filter(Boolean).reduce((o,s)=>o?(/[-_]$/.test(o)?o+s:o+' '+s):s,'').replace(/\s*_\s*/g,'_').replace(/\s+/g,' ').trim();
  const cz=ntfNz(content);
  const amtO=a2&&a2.v?a2:a1,amount=amtO?amtO.v:0,sign=(a1&&a1.sign)||(a2&&a2.sign)||0;
  let kind;
  if(/refund|hoan tien|hoan tra|reversal|cashback|cash back|tra lai|huy giao dich/.test(cz))kind='refund';
  else if(/payment to client|payment from|thanh toan the|thanh toan du no|tra no|repayment|nop tien|ghi co/.test(cz))kind='payment';
  else if(sign<0)kind='spend';
  else kind=sign>0?'payment':'spend';
  /* điểm bán: Retail_VNM_TAY NINH_HKD LAGOM 1994-1 → HKD LAGOM 1994-1 */
  let merchant=content;
  if(kind!=='payment'){const ps=content.replace(/^(?:retail|ecom|e-?commerce|pos|atm|online)_/i,'').split('_').filter(Boolean);if(ps.length>=3&&/^[A-Z]{2,3}$/.test(ps[0]))merchant=ps.slice(2).join(' ');else if(ps.length===2&&/^[A-Z]{2,3}$/.test(ps[0]))merchant=ps[1];else merchant=ps.join(' ')}
  merchant=merchant.slice(0,80);
  const why=[];
  if(!amount)why.push('không đọc được số tiền');
  if(a1&&a2&&a1.cur==='VND'&&a2.cur==='VND'&&a1.v!==a2.v)why.push('2 số tiền trên bill không khớp nhau');
  if(!a2||!a2.v)why.push('thiếu số tiền quy đổi nội tệ');
  else if(amount<1000)why.push('số tiền bất thường');
  if(!cm)why.push('không đọc được số thẻ');
  if(!date)why.push('không đọc được ngày');
  if(!sign&&!/refund|payment|hoan|thanh toan|tra no|nop tien|ghi co|reversal|cashback/.test(cz))why.push('không rõ tiền vào hay tiền ra');
  return{bank:'BIDV',kind,amount,sign,last4:cm?cm[2]:'',first:cm?cm[1]:'',cardName:'',merchant,content,ts:date,settle,appr:ap,cur:a1&&a1.cur!=='VND'?a1.cur:'VND',raw:raw.slice(0,1500),sure:!why.length,why:why.join(', ')};
}
/* Tạo mục hàng chờ từ bill; trả về kết quả để báo lại */
async function billAdd(p,o,batch){
  const day=String(p.ts||'').slice(0,10);
  const id='b_'+[p.bank||'x',p.last4||'x',day||'x',p.kind,+p.amount||0].join('_').replace(/[^A-Za-z0-9_-]/g,'');
  const ex=D.inbox.find(x=>x.id===id);
  if(ex)return{id,st:'dup',p,msg:'Bill này đã đọc trước đây'};
  /* bản đọc cũ của cùng bill nhưng nhận sai loại (VD thanh toán thẻ bị hiểu là chi tiêu) → bỏ bản cũ nếu chưa ghi sổ */
  for(const x of D.inbox)if(x.src==='bill'&&x.status==='pending'&&x.kind!==p.kind&&x.bank===p.bank&&x.last4===p.last4&&+x.amount===+p.amount&&String(x.ts||'').slice(0,10)===day)await put('inbox',{...x,status:'skip',note:'Đọc lại: đúng loại là '+({payment:'thanh toán thẻ',spend:'chi tiêu',refund:'hoàn tiền'}[p.kind]||p.kind)});
  const it={id,src:'bill',owner:(o.owner||'').trim()||p.holder||'',recv:new Date().toISOString(),subject:'',from:'',...p,status:HC_TX(p.kind)?'pending':'info'};
  delete it.sure;delete it.why;delete it.generic;delete it.rcpt;delete it.dateRaw;
  if(p.kind==='stmt'&&+p.amount>0){it.status='info';await put('inbox',it);return{id,st:'info',p,msg:'Đã lưu vào tab “Sao kê & khác” — '+(p.note||'')}}
  /* mẫu chưa hỗ trợ: chỉ đưa vào hàng chờ khi đọc được cả số tiền và (số thẻ hoặc ngày) — tránh tạo GD rác từ ảnh không phải bill */
  if(p.generic&&!(+p.amount>0&&p.last4&&String(p.ts||'').length>=10))return{id,st:'bad',p,msg:'Không nhận ra bill giao dịch trong ảnh — mẫu ngân hàng này chưa được hỗ trợ. Gửi ảnh mẫu để thêm.'};
  if(!HC_TX(p.kind)||!(+p.amount>0)){it.status='info';it.review=true;it.note='Ảnh chụp chưa đọc được giao dịch'+(p.why?' · '+p.why:'');await put('inbox',it);return{id,st:'bad',p,msg:it.note}}
  if(p.why)it.note='Đọc từ ảnh: '+p.why;
  /* trùng giao dịch đã có từ email / thông báo app (cùng thẻ, số tiền, ngày, loại) */
  const same=D.inbox.find(x=>x.id!==id&&x.status!=='ignored'&&x.status!=='skip'&&HC_TX(x.kind)&&x.kind===it.kind&&+x.amount===+it.amount&&(!x.last4||!it.last4||x.last4===it.last4)&&(!x.bank||x.bank===it.bank)&&String(x.ts||'').slice(0,10)===day);
  if(same){it.status='skip';it.dupOf=same.id;it.note=((it.note?it.note+' · ':'')+'Trùng '+({email:'email',android:'thông báo app',paste:'thông báo dán tay',bill:'bill khác'}[same.src]||'mục khác')+' cùng giao dịch'+(same.status==='done'?' (đã ghi sổ)':' (đang chờ duyệt)'));await put('inbox',it);return{id,st:'dup',p,msg:it.note}}
  await put('inbox',it);
  const cid=hcCard(it).cardId;
  if(!cid)return{id,st:'wait',p,msg:'Chưa khớp thẻ nào (thẻ '+(p.last4||'?')+') — chọn thẻ trong Hàng chờ'};
  if(hcDup(it,cid))return{id,st:'wait',p,msg:'Sổ đã có GD cùng thẻ, số tiền, ngày — kiểm tra trong Hàng chờ'};
  if(!o.auto)return{id,st:'wait',p,msg:'Chờ anh duyệt'};
  if(!p.sure)return{id,st:'wait',p,msg:'Chờ duyệt: '+(p.why||'cần kiểm tra')};
  if(it.kind==='spend'){const c=D.cards.find(x=>x.id===cid);if((c.rules||[]).length>1&&!hcMcc(it,cid))return{id,st:'wait',p,msg:'Chờ chọn MCC (thẻ có nhiều nhóm hoàn tiền)'}}
  if(await hcApprove(id,true,batch))return{id,st:'ok',p,msg:'Đã ghi vào sổ'};
  return{id,st:'wait',p,msg:'Chờ duyệt'};
}

    <div class="kn2-bk">${bkI.map(o=>`<div><span class="bkb" style="--bk:${bkC(o.b.name)}">${esc(bkA(o.b.name))}</span><div class="bar ${o.k===o.n?'g':o.k?'w':'b'}"><i style="width:${o.n?o.k/o.n*100:0}%"></i></div><b class="${o.k===o.n?'pos':''}">${o.k}/${o.n}</b></div>`).join('')}</div></div>
    <div><h3 style="margin-bottom:8px">Trạng thái</h3>${ring(stI,allU.length,'cặp user–bank')}</div>
    <div><h3 style="margin-bottom:8px">Kênh nhận</h3>${ring(chI,need.length,'cần kết nối')}</div></div>`;
  const T=[['','Tất cả',allU.length],...['ok','set','old','none','skip'].map(k=>[k,KL[k],allU.filter(r=>r.st===k).length])];
  /* --- bảng --- */
  const chip2=(k)=>`<span class="kn2-ch" style="--c:${CH[k][1]}">${CH[k][0]}</span>`;
  const stc=k=>`<span class="kn2-st" style="--c:${KC[k]}">${KL[k]}</span>`;
  const tk=(n,l)=>`<span class="kn2-k ${n?'on':''}">${n?'✓':'—'} ${l}${n?` <small>${n}</small>`:''}</span>`;
  let rows='';
  BL.forEach(b=>{
    const V2=b.us.filter(r=>!f||r.st===f);if(!V2.length)return;
    const n=b.us.filter(r=>r.st!=='skip'),k=n.filter(r=>['ok','old','set'].includes(r.st)).length,full=n.length&&k===n.length;
    const open=f?true:(b.name in G?G[b.name]:!full);
    rows+=`<tr class="kn2-g${open?' op':''}" data-a="kn2g" data-id="${esc(b.name)}"><td colspan="7"><div class="kn2-gh"><span class="kn2-cv">${ico('chev',16)}</span><span class="bkb" style="--bk:${bkC(b.name)}">${esc(bkA(b.name))}</span><b>${esc(b.name)}</b><span class="kn2-st" style="--c:${full?KC.ok:k?KC.old:KC.none}">${full?'✓ Đủ ':''}${k}/${n.length} người</span><span class="hint kn2-gs">${b.us.length} user · ${fmt(sum(b.us,r=>r.n))} thư</span></div></td></tr>`;
    if(!open)return;
    V2.forEach(r=>{const key=b.name+'|'+r.owner,xo=!!X[key];
      rows+=`<tr class="kn2-r${xo?' op':''}" style="--c:${KC[r.st]}" data-a="kn2x" data-id="${esc(key)}"><td class="u"><i class="kn2-dot"></i><b>${esc(r.owner)}</b><div class="hint">${r.cards.length} thẻ</div></td><td class="b"><span class="bkb" style="--bk:${bkC(b.name)}">${esc(bkA(b.name))}</span></td><td class="c">${chip2(r.ch)}</td><td class="s">${stc(r.st)}</td><td class="n">${fmt(r.n)}<div class="hint">thư</div></td><td class="l">${r.last?dtShow(r.last)+`<div class="hint">${r.age===0?'hôm nay':r.age+' ngày trước'}</div>`:'<span class="mut">—</span>'}</td><td class="x"><span class="kn2-cv">${ico('chev',16)}</span></td></tr>`;
      if(xo)rows+=`<tr class="kn2-d"><td colspan="7"><div class="kn2-dd">
        <div><div class="hint">Mail chủ thẻ</div>${r.em.length?r.em.map(e=>`<div class="mono">${esc(e)}</div>`).join(''):'<span class="mut">— chưa ghép mail</span>'}</div>
        <div><div class="hint">Loại thư đã nhận</div><div class="row" style="gap:6px">${tk(r.k.spend,'Chi tiêu')}${tk(r.k.refund,'Hoàn tiền')}${tk(r.k.payment,'Thanh toán')}${tk(r.k.stmt,'Sao kê')}</div></div>
        <div><div class="hint">Thẻ</div>${r.cards.length?r.cards.map(c=>`<div>${cname(c)}</div>`).join(''):'<span class="mut">Chưa có thẻ trong app</span>'}${r.via.length?`<div class="hint">Qua: ${r.via.map(esc).join(', ')}</div>`:''}</div>
        <div class="row" style="gap:6px;align-self:end">${r.cards.length&&!r.n&&!r.skip?btn(r.on?'Bỏ đã cài':'Đánh dấu đã cài','kn-onu',key,'s'):''}${r.cards.length?btn(r.skip?'Cần kết nối':'Không cần kết nối','kn-skipu',key,'s'):''}</div></div></td></tr>`;
    });
  });
  const allOpen=BL.every(b=>f||(b.name in G?G[b.name]:!(b.us.filter(r=>r.st!=='skip').every(r=>['ok','old','set'].includes(r.st)))));
  return hd('Kết nối Gmail','Mỗi dòng là một cặp chủ thẻ – ngân hàng. Chạm vào dòng để xem mail, loại thư đã nhận và thao tác',btn('Cài đặt','hc-cfg',null,'','gear')+btn('Hàng chờ','kn-hc',null,'','pay')+btn(HC_BUSY?'Đang đọc…':'Lấy thư mới','hc-sync',null,'p','repeat'))+
  `<p class="hint" style="margin:-6px 0 0">${UI.hcMsg?'<b>'+esc(UI.hcMsg)+'</b> · ':''}Lần đọc Gmail gần nhất: ${last} · “Đang nhận thư” = có thư trong ${KN_FRESH} ngày gần nhất</p>`+stats+
  `<div class="row" style="justify-content:space-between;gap:8px"><div class="tabs" role="tablist" style="flex:1 1 auto">${T.map(t=>`<button class="${f===t[0]?'on':''}" data-a="kn-f" data-id="${t[0]||'all'}">${t[1]} <span class="mut">${t[2]}</span></button>`).join('')}</div>${f?'':btn(allOpen?'Thu gọn tất cả':'Mở tất cả','kn2all',allOpen?'0':'1','s')}</div>`+
  (rows?`<div class="card kn2w"><table class="kn2"><thead><tr><th>Chủ thẻ</th><th>Ngân hàng</th><th>Kênh</th><th>Trạng thái</th><th class="n">Thư</th><th>Thư gần nhất</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Không có mục phù hợp','Thử đổi bộ lọc.'));
}
/* dùng màu & viết tắt ngân hàng của lớp giao diện */
const bkC=b=>window.__bkCol?window.__bkCol(b):'#6b7280';
const bkA=b=>window.__bkAb?window.__bkAb(b):String(b||'?').slice(0,4).toUpperCase();
Object.assign(ACT,{
  kn2g:id=>{const G=UI.knG||(UI.knG={}),el=document.querySelector('tr.kn2-g[data-id="'+CSS.escape(id)+'"]');G[id]=!(el&&el.classList.contains('op'));render()},
  kn2x:id=>{const X=UI.knX||(UI.knX={});X[id]=!X[id];render()},
  kn2all:id=>{const G=UI.knG||(UI.knG={});document.querySelectorAll('tr.kn2-g').forEach(t=>G[t.dataset.id]=id==='1');render()}
});
window.pgKN2=pgKN2;
})();
</script>
