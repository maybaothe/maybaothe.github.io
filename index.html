/* ---------- Thu gọn / mở rộng (nhớ trạng thái riêng cho máy tính & điện thoại) ---------- */
let FD={};try{FD=JSON.parse(localStorage.getItem('ux_fold')||'{}')||{}}catch(e){}
const fk=k=>(sm()?'m:':'d:')+k;
function fold(key,els,title,sumTxt,force){
  els=els.filter(e=>e&&e.parentNode);if(!els.length)return null;
  const k=fk(key),open=force||(k in FD?FD[k]:!sm());
  const d=document.createElement('details');d.className='fold';d.dataset.fk=k;if(open)d.open=true;
  d.innerHTML=`<summary><span class="fold-t">${title}</span><span class="fold-s">${sumTxt||''}</span>${ico('chev',16)}</summary><div class="fold-b"></div>`;
  els[0].before(d);const b=d.lastElementChild;els.forEach(e=>b.appendChild(e));
  return d;
}
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.classList&&d.classList.contains('fold')){FD[d.dataset.fk]=d.open;try{localStorage.setItem('ux_fold',JSON.stringify(FD))}catch(x){}}},true);

/* ---------- Gom nút phụ vào menu ⋯ ---------- */
function actMenu(top){
  const row=top&&top.querySelector(':scope>.row');if(!row)return;
  const bs=[...row.querySelectorAll(':scope>.btn')];
  if(bs.length<=(mob()?1:3))return;
  const keep=bs.filter(b=>b.classList.contains('p')),extra=bs.filter(b=>!keep.includes(b));
  if(!extra.length)return;
  const w=document.createElement('div');w.className='xm';
  w.innerHTML=`<button type="button" class="btn xm-t" data-ux="xm" aria-haspopup="true" aria-expanded="false" title="Thao tác khác">${ico('dots',18)}<span>Thao tác khác</span></button><div class="xm-p" hidden></div>`;
  const p=w.lastElementChild;extra.forEach(b=>{p.appendChild(b);if(!b.textContent.trim())b.append(b.title||'')});
  row.insertBefore(w,keep[0]||null);
}

/* ---------- Gắn nhãn cột cho bảng (để hiện dạng thẻ trên điện thoại) ---------- */
const keyOf=s=>noAccent(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function labelTables(main){
  main.querySelectorAll('.tw table').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(!hs.length)return;
    const seen={},ks=hs.map(h=>{const k=keyOf(h);seen[k]=(seen[k]||0)+1;return seen[k]>1?k+seen[k]:k});
    t.querySelectorAll('tbody tr').forEach(tr=>{let i=0;[...tr.children].forEach(td=>{td.dataset.th=hs[i]||'';td.dataset.k=ks[i]||'';if(!hs[i]&&i>0)td.classList.add('xact');i+=+td.colSpan||1})});
  });
}

/* ---------- Danh sách thẻ: thu gọn từng thẻ trên điện thoại ---------- */
const XC=new Set();
function cardRows(main){
  main.querySelectorAll('.crow').forEach(r=>{const b=r.querySelector('[data-a="cdetail"]');if(!b)return;const id=b.dataset.id;r.dataset.cid=id;r.classList.toggle('cc',!XC.has(id))});
}


/* ---------- Màu ngân hàng, loại giao dịch, vạch phân ngày ---------- */
const BKC={bidv:'#0d9488',vib:'#ea580c',vpbank:'#16a34a',sacombank:'#2563eb',tpbank:'#7c3aed',techcombank:'#dc2626',mb:'#4f46e5',mbbank:'#4f46e5',acb:'#0284c7',hdbank:'#e11d48',vietcombank:'#15803d',vietinbank:'#1d4ed8',shinhan:'#1e40af',hsbc:'#b91c1c',ocb:'#c2410c',msb:'#be123c',seabank:'#b45309',shb:'#d97706',lpbank:'#9333ea',eximbank:'#0369a1',agribank:'#9f1239',namabank:'#0f766e',cake:'#db2777',timo:'#a21caf'};
const bkKey=b=>noAccent(b).toLowerCase().replace(/[^a-z]/g,'');
const bkCol=b=>BKC[bkKey(b)]||`hsl(${hue(b)} 55% 42%)`;
const bkAb=b=>{const k=bkKey(b);return({vietcombank:'VCB',vietinbank:'CTG',techcombank:'TCB',sacombank:'STB',vpbank:'VPB',tpbank:'TPB',hdbank:'HDB',seabank:'SEA',namabank:'NAB',lpbank:'LPB',eximbank:'EIB',agribank:'AGR',shinhan:'SHN',mbbank:'MB'}[k])||String(b||'?').replace(/\s+/g,'').slice(0,4).toUpperCase()};
window.__bkCol=bkCol;window.__bkAb=bkAb;
const KMAP={'chi tieu':'spend','thanh toan':'payment','hoan tien':'cashback','tich diem':'points'};
function colorize(main){
  const banks=[...new Set(D.cards.map(c=>c.bank).filter(Boolean))].sort((a,b)=>b.length-a.length);
  const bankIn=t=>banks.find(b=>t.startsWith(b));
  main.querySelectorAll('.tw table').forEach(t=>{
    const isTx=t.classList.contains('txt')||!!t.querySelector('th')&&[...t.querySelectorAll('th')].some(h=>h.textContent.trim()==='Loại')&&!!t.querySelector('td[data-k^="sotien"]');
    const rows=[...t.querySelectorAll('tbody tr')];let lastDay='',ncol=t.querySelectorAll('thead th').length;
    rows.forEach(tr=>{
      const ct=tr.querySelector('td[data-k="thechuthe"],td[data-k="the"]');
      if(ct&&!ct.querySelector('select,.bkb')){const tx=ct.textContent.trim(),b=bankIn(tx);if(b){tr.style.setProperty('--bk',bkCol(b));ct.insertAdjacentHTML('afterbegin',`<span class="bkb" style="--bk:${bkCol(b)}">${esc(bkAb(b))}</span>`)}}
      if(!isTx)return;
      const lc=tr.querySelector('td[data-k="loai"]'),k=lc?KMAP[noAccent(lc.textContent.trim()).toLowerCase()]:(t.classList.contains('txt')?'spend':'');
      if(k)tr.dataset.kind=k;
      const dc=tr.querySelector('td[data-k="ngay"]');const day=dc?(dc.textContent.match(/\d{2}\/\d{2}\/\d{2}/)||[''])[0]:'';
      if(day&&day!==lastDay){lastDay=day;const [d,m,y]=day.split('/'),dt=new Date(2000+ +y,+m-1,+d),dd=diff(dt,V.ref);
        const lab=dd===0?'Hôm nay':dd===1?'Hôm qua':['CN','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][dt.getDay()];
        const same=rows.filter(r=>{const c=r.querySelector('td[data-k="ngay"]');return c&&c.textContent.includes(day)});
        const tot=sum(same,r=>{const a=r.querySelector('td[data-k^="sotien"]');return a&&r.dataset.kind!=='points'?num(a.textContent):0});
        const h=document.createElement('tr');h.className='dayh';h.innerHTML=`<td colspan="${ncol||11}">${lab} · ${d}/${m}/20${y}<span class="dsum">${same.length} GD · ${fmt(tot)} ₫</span></td>`;tr.before(h)}
    });
    if(isTx&&!t.closest('.tw').querySelector('.leg-k')){const L=document.createElement('div');L.className='leg-k';L.innerHTML='<span><i style="background:var(--k-spend)"></i>Chi tiêu</span><span><i style="background:var(--k-pay)"></i>Thanh toán thẻ</span><span><i style="background:var(--k-cb)"></i>Hoàn tiền</span><span><i style="background:var(--k-pt)"></i>Tích điểm</span><span><i style="background:#173447;border:1px solid #38bdf8"></i>Lấy từ mail</span>';t.before(L)}
  });
  main.querySelectorAll('.crow').forEach(r=>{const id=r.dataset.cid||(r.querySelector('[data-a="cdetail"]')||{}).dataset?.id,c=D.cards.find(x=>x.id===id);if(!c)return;r.style.setProperty('--bk',bkCol(c.bank));const n=r.querySelector('.cr-name');if(n&&!n.previousElementSibling?.classList?.contains('bkb'))n.insertAdjacentHTML('beforebegin',`<span class="bkb" style="--bk:${bkCol(c.bank)}">${esc(bkAb(c.bank))}</span>`)});
  main.querySelectorAll('.tbc').forEach(r=>{const i=r.querySelector('.tbi');if(!i)return;const b=r.querySelector('b');const c=b&&D.cards.find(x=>b.textContent.startsWith(x.bank));if(c){i.style.background=bkCol(c.bank);i.style.color='#fff';i.textContent=bkAb(c.bank)}});
  main.querySelectorAll('.av').forEach(a=>{const L=[...new Set(D.cards.filter(x=>(x.bank||'').slice(0,2).toUpperCase()===a.textContent.trim()).map(x=>x.bank))],c=L.length===1&&D.cards.find(x=>x.bank===L[0]);if(c){a.textContent=bkAb(c.bank);a.style.setProperty('background',bkCol(c.bank),'important');a.style.setProperty('color','#fff','important')}});
}

/* ---------- Xử lý sau mỗi lần vẽ trang ---------- */
function tidy(){
  drawBars();
  document.body.dataset.pg=UI.page;
  const main=$('#main');if(!main)return;
  const top=main.querySelector(':scope>.top');if(!top)return;
  const g=grOf(UI.page),pg=UI.page;
  /* tiêu đề nhóm + tab con */
  if(g.p.length>1){
    const h1=top.querySelector('h1');if(h1)h1.textContent=g.l;
    const nav=document.createElement('nav');nav.className='gt';nav.setAttribute('aria-label',g.l);
    nav.innerHTML=g.p.map(([id,l])=>`<a href="#${id}" class="${id===pg?'on':''}"${id===pg?' aria-current="page"':''}>${l}${bdg(pCnt(id))}</a>`).join('');
    top.after(nav);
    const on=nav.querySelector('.on');if(on&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=on.offsetLeft-12;
  }
  actMenu(top);
  /* Kết nối / Lịch thanh toán đã tách thành 2 tab của nhóm → bỏ công tắc cũ trong trang */
  main.querySelectorAll('.tabs').forEach(t=>{if(t.querySelector('[data-a="kn-view"]'))t.remove()});
  /* dải nhắc nhở chỉ hiện ở Tổng quan & Nhắc việc (chuông luôn có số đếm) */
  if(!['tong-quan','thong-bao','sao-ke','du-no'].includes(pg))main.querySelectorAll(':scope>.bwrap').forEach(b=>b.remove());
  main.querySelectorAll('.hero a[href="#thong-bao"]').forEach(a=>{const n=[...a.childNodes].reverse().find(x=>x.nodeType===3);if(n)n.textContent=n.textContent.replace('Nhắc nhở','Nhắc việc')});
  labelTables(main);
  try{colorize(main)}catch(e){console.error('colorize',e)}
  const kv=(sc,i)=>{const v=sc&&sc.querySelectorAll('.kpi .v')[i];return v?v.textContent.trim():''};
  if(pg==='tong-quan'){
    const ch=main.querySelector('.dash .g2');
    if(ch)fold('tq-chart',[ch],'Biểu đồ hoàn tiền & dư nợ','6 tháng gần nhất');
  }
  if(pg==='ket-noi'&&sm()){
    const st=main.querySelector('.kn2-s');if(st){const big=st.querySelector('.kn2-big'),t=st.querySelectorAll('.kn2-p>.hint')[1];fold('kn-stat',[st],'Thống kê kết nối',(big?big.textContent:'')+(t?' · '+t.textContent.split(' cặp')[0]+' cặp':''))}
  }
  if(pg==='giao-dich'){
    const ks=[...main.children].filter(e=>e.matches('.grid,.g2'));
    if(ks.length){const sc=ks[0];fold('gd-stat',ks,'Thống kê & biểu đồ',[kv(sc,0)&&'Chi '+kv(sc,0),kv(sc,3)&&'Lãi '+kv(sc,3)].filter(Boolean).join(' · '))}
  }
  if(pg==='the'){
    const pc=[...main.querySelectorAll(':scope>.card')].find(c=>c.querySelector('[data-sl]'));
    if(pc){const act=CF.some(([k])=>UI[k]);fold('the-pf',[pc],'Lọc theo ngân hàng · chủ thẻ · tên thẻ',act?'Đang lọc: '+CF.filter(([k])=>UI[k]).map(([k])=>UI[k]).join(', '):'',act)}
    cardRows(main);
  }
  /* bộ lọc ngày/ngân hàng/user ở Hàng chờ & Lịch thanh toán: thu gọn được */
  [['hang-cho','hcf','hcF'],['sao-ke','skf','skF']].forEach(([p,a,u])=>{
    if(pg!==p)return;const fb=main.querySelector(':scope>.card:has([data-'+a+'])');if(!fb)return;
    const F=UI[u]||{},on=Object.values(F).some(Boolean);
    fold(p+'-f',[fb],'Bộ lọc',on?'Đang lọc':'Ngày · ngân hàng · user',on);
  });
  if(pg==='huong-dan'&&!main.querySelector('.umap')){
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<h3>Bố cục app</h3><p class="hint" style="margin:-4px 0 12px">Các chức năng được gom thành ${GR.length} nhóm. Trên điện thoại: thanh dưới có Tổng quan · Thẻ · nút <b>+</b> (thêm nhanh) · Giao dịch · Menu; chuông góc trên là Nhắc việc.</p><div class="umap">${GR.map(x=>`<div><b>${ico(x.ic,16)}${x.l}</b><div class="hint">${x.d}</div><ul style="margin:6px 0 0;padding-left:18px">${x.p.map(([id,l])=>`<li><a href="#${id}">${l}</a></li>`).join('')}</ul></div>`).join('')}</div>`;
    top.nextElementSibling?top.nextElementSibling.after(c):top.after(c);
  }
}
const dPrev=draw;
draw=function(){dPrev();try{tidy()}catch(e){console.error('ux2',e)}};

/* ---------- Sự kiện ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  /* menu ⋯ */
  const xm=t.closest('[data-ux="xm"]');
  document.querySelectorAll('.xm-p').forEach(p=>{if(!xm||p!==xm.nextElementSibling){p.hidden=true;const b=p.previousElementSibling;if(b)b.setAttribute('aria-expanded','false')}});
  if(xm){const p=xm.nextElementSibling;p.hidden=!p.hidden;xm.setAttribute('aria-expanded',String(!p.hidden));return}
  /* bấm 1 mục trong tấm chọn → đóng tấm */
  if(t.closest('.uxs [data-a], .uxs a'))setTimeout(closeSheet,0);
  const u=t.closest('[data-ux]');
  if(u){
    const k=u.dataset.ux;
    if(k==='go'){location.hash=u.dataset.h.slice(1);return}
    if(k==='quick')return quickSheet();
    if(k==='menu')return menuSheet();
    if(k==='sclose')return closeSheet();
    if(k==='sync'){closeSheet();location.hash='hang-cho';if(ACT['hc-sync'])ACT['hc-sync']();return}
    if(k==='bot'){closeSheet();const f=document.querySelector('#bot .bfab');if(f)f.click();return}
  }
  /* thẻ trên điện thoại: chạm vào tên thẻ để mở/thu gọn */
  if(sm()){const h=t.closest('.crow .cr-id');if(h&&!t.closest('button,a,input,select')){const r=h.closest('.crow'),id=r.dataset.cid;if(id){if(XC.has(id))XC.delete(id);else XC.add(id);r.classList.toggle('cc',!XC.has(id))}}}
});
/* đổi cỡ màn hình (xoay ngang/dọc) → vẽ lại cho đúng bố cục */
let rw=innerWidth;addEventListener('resize',()=>{if((rw<=860)!==(innerWidth<=860)||(rw<=640)!==(innerWidth<=640)){rw=innerWidth;render()}});
/* mở đúng trang mới nếu link có #sao-ke */
if(location.hash==='#sao-ke')route();else render();
})();

<script id="pwa-ui">
'use strict';
/* ===== PWA: thẻ Tài khoản + Cầu nối Gmail trong Hệ thống → Cài đặt ===== */
(()=>{
const card=()=>{
  const s=S(),u=window.PWA_USER||{},ok=!!(s.gasUrl&&s.gasKey);
  return `<div class="card" id="pwa-acc"><h3><span>Tài khoản & cầu nối Gmail</span>${ok?chip('Đã cài cầu nối','g'):chip('Chưa cài cầu nối Gmail','w')}</h3>
  <div class="kv" style="margin-bottom:12px"><span>Đang đăng nhập</span><span>${esc(u.name||'')}${u.email?' · '+esc(u.email):''}</span></div>
  <div class="fg"><div class="f w2"><label>Địa chỉ cầu nối (Apps Script web app, dạng https://script.google.com/macros/s/…/exec)</label><input id="gasUrl" value="${esc(s.gasUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
  <div class="f w2"><label>Khóa cầu nối</label><input id="gasKey" value="${esc(s.gasKey||'')}" placeholder="Khóa bí mật trong script" autocomplete="off"></div></div>
  <div class="row" style="margin-top:12px;justify-content:space-between"><div class="row">${btn('Lưu cầu nối','pwa-gas',null,'p s','check')}${btn('Kiểm tra','pwa-gasping',null,'s','repeat')}</div>${btn('Đăng xuất','pwa-out',null,'s d')}</div>
  <p class="hint" id="gasMsg" style="margin:8px 0 0"></p></div>`;
};
ACT['pwa-gas']=async()=>{const url=($('#gasUrl')||{}).value||'',key=($('#gasKey')||{}).value||'';await put('settings',{...S(),id:'main',gasUrl:url.trim(),gasKey:key.trim()});toast('Đã lưu cầu nối Gmail')};
ACT['pwa-gasping']=async()=>{const url=(($('#gasUrl')||{}).value||'').trim(),key=(($('#gasKey')||{}).value||'').trim(),m=$('#gasMsg');if(!url||!key){m.textContent='Nhập địa chỉ và khóa trước.';return}
  m.textContent='Đang kiểm tra…';try{const r=await fetch(url+(url.includes('?')?'&':'?')+new URLSearchParams({k:key,a:'ping'}));const j=await r.json();m.textContent=j.ok?'✓ Cầu nối hoạt động — nhãn “'+(j.label||'')+'”, '+(j.count!=null?j.count+' luồng thư':'')+'.':'Lỗi: '+(j.error||'không rõ')}catch(e){m.textContent='Không gọi được cầu nối: kiểm tra địa chỉ và quyền truy cập “Bất kỳ ai”.'}};
ACT['pwa-out']=(id,b)=>two(b,()=>window.pwaSignOut&&window.pwaSignOut());
const d0=draw;draw=function(){d0();try{if(UI.page==='cai-dat'){const top=document.querySelector('#main>.top'),gt=document.querySelector('#main>.gt');if(top&&!document.getElementById('pwa-acc'))(gt||top).insertAdjacentHTML('afterend',card())}}catch(e){console.error(e)}};
})();
</script>
</body></html>
